name: Cleanup old cover summary
on:
  push:
    branches:
      - feat/dynamic-atlas-cover-contents-svg
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-atlas-cover-contents-svg
      - name: Remove legacy cover summary asset and references
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/summary/atlas-export-pdf.ts')
          text = path.read_text()
          replacements = {
              "const [coverImage, coverSummaryImage, signatureImage, stampImage] = await Promise.all([": "const [coverImage, signatureImage, stampImage] = await Promise.all([",
              "    loadAssetAsJpeg('/assets/shared/pdf/atlas-cover-summary-card.svg', 1240, 500, 'contain'),\n": "",
              "  const coverSummaryImageId = coverSummaryImage ? reserve() : 0;\n": "",
              "  if (coverSummaryImage && coverSummaryImageId) writeJpegObject(coverSummaryImageId, coverSummaryImage);\n": "",
              "    if (coverSummaryImageId) xObjectEntries.push(`/ImCoverSummary ${coverSummaryImageId} 0 R`);\n": "",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected legacy reference not found: {old!r}')
              text = text.replace(old, new, 1)
          if 'coverSummaryImage' in text or 'ImCoverSummary' in text or 'atlas-cover-summary-card.svg' in text:
              raise SystemExit('Legacy cover summary reference still present')
          path.write_text(text)
          PY
          rm -f public/assets/shared/pdf/atlas-cover-summary-card.svg
          rm -f .github/workflows/cleanup-old-cover-summary.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace legacy cover summary with dynamic contents slip"
          git push origin HEAD:feat/dynamic-atlas-cover-contents-svg