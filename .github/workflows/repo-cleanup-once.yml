name: One-time repository cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repo-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Consolidate repository
        run: node scripts/repo-cleanup-once.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify cleaned repository
        run: npm run verify:city-template

      - name: Commit cleaned state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Cleanup produced no changes"; exit 1; }
          git commit -m "Consolidate canonical Atlas content"
          git push origin HEAD:master
