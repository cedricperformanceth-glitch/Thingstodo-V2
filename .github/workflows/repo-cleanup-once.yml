name: One-time repository cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repo-cleanup-once.yml'
      - 'scripts/prepare-cleanup-runner-once.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare canonical validator
        run: node scripts/prepare-canonical-validator-once.mjs

      - name: Prepare one-time cleanup runner
        run: node scripts/prepare-cleanup-runner-once.mjs

      - name: Consolidate repository
        run: node scripts/repo-cleanup-once.mjs

      - name: Remove dead short-card payloads
        run: node scripts/repo-cleanup-finalize-once.mjs

      - name: Commit canonical cleaned state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Cleanup produced no changes"; exit 1; }
          git commit -m "Consolidate canonical Atlas content"
          git push origin HEAD:master

      - name: Install dependencies
        run: npm ci

      - name: Verify cleaned repository
        run: npm run verify:city-template
