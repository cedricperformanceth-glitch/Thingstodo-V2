name: Apply PDF typography pass

on:
  push:
    branches:
      - feat/pdf-ink-blue-schoolbell-summary

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-ink-blue-schoolbell-summary
      - name: Apply targeted PDF changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/summary/atlas-export-pdf.ts')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected source block not found:\n{old}')
              text = text.replace(old, new, 1)

          replace_once(
              "const ATLAS_GREEN: [number, number, number] = [0.19, 0.33, 0.27];\nconst HANDWRITING_FONT = 'Caveat';",
              "const ATLAS_GREEN: [number, number, number] = [0.19, 0.33, 0.27];\n// Deep fountain-pen ink blue, kept close to the Laos navy identity.\nconst FOUNTAIN_INK_BLUE: [number, number, number] = [0.141, 0.278, 0.435];\nconst HANDWRITING_FONT = 'Caveat';",
          )

          replace_once(
              "  const titleColor: [number, number, number] = [0.12, 0.2, 0.16];\n  const headingCountry = uniqueCountries.length === 1 ? titleize(uniqueCountries[0]) : '';\n  const headingLabel = headingCountry ? `My Atlas ${headingCountry}` : 'My Atlas';\n  const closingLineOne = 'Thanks for letting Things To Do Atlas travel with you.';\n  const closingLineTwo = 'Keep exploring, stay curious, and have a beautiful journey.';\n  await addHandwritingAsset(headingLabel, 25.5, titleColor, COUNTRY_CITY_FONT, '400');\n  await addHandwritingAsset('Contents', 17.5, titleColor);\n  await addHandwritingAsset(closingLineOne, 10.8, titleColor, SCHOOLBELL_FONT, '400');\n  await addHandwritingAsset(closingLineTwo, 10.4, MUTED, SCHOOLBELL_FONT, '400');\n  for (const [country, cities] of countries) {\n    if (multiCountry) await addHandwritingAsset(`My Atlas ${titleize(country)}`, 20, titleColor, COUNTRY_CITY_FONT, '400');\n    for (const city of cities.keys()) await addHandwritingAsset(titleize(city), 16.5, titleColor, COUNTRY_CITY_FONT, '400');\n  }",
              "  const titleColor: [number, number, number] = [0.12, 0.2, 0.16];\n  const headingCountry = uniqueCountries.length === 1 ? titleize(uniqueCountries[0]) : '';\n  const headingLabel = headingCountry ? `My Atlas ${headingCountry}` : 'My Atlas';\n  const journeyLabel = 'Your journey so far';\n  const journeyCount = `${entries.length} saved ${entries.length === 1 ? 'place' : 'places'}`;\n  const closingLineOne = 'Thanks for letting Things To Do Atlas travel with you.';\n  const closingLineTwo = 'Keep exploring, stay curious, and have a beautiful journey.';\n  await addHandwritingAsset(headingLabel, 27.5, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');\n  await addHandwritingAsset('Contents', 17.5, titleColor);\n  await addHandwritingAsset(journeyLabel, 10.4, MUTED, SCHOOLBELL_FONT, '400');\n  await addHandwritingAsset(journeyCount, 10.4, MUTED, SCHOOLBELL_FONT, '400');\n  await addHandwritingAsset(closingLineOne, 10.8, titleColor, SCHOOLBELL_FONT, '400');\n  await addHandwritingAsset(closingLineTwo, 10.4, MUTED, SCHOOLBELL_FONT, '400');\n  for (const [country, cities] of countries) {\n    if (multiCountry) await addHandwritingAsset(`My Atlas ${titleize(country)}`, 21.5, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');\n    for (const city of cities.keys()) await addHandwritingAsset(titleize(city), 17.8, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');\n  }",
          )

          replace_once(
              "  };\n\n  let page!: PdfPage;\n  let y = PAGE_H - 112;",
              "  };\n\n  const pdfHandwrittenRightText = (\n    target: PdfPage,\n    text: string,\n    rightX: number,\n    baselineY: number,\n    size: number,\n    color: [number, number, number] = titleColor,\n    fontFamily = HANDWRITING_FONT,\n    weight: '400' | '600' = '600',\n  ) => {\n    const asset = handwritingAssets.get(handwrittenKey(text, size, color, fontFamily, weight));\n    if (!asset) {\n      const estimatedWidth = text.length * size * 0.42;\n      pdfText(target, text, rightX - estimatedWidth, baselineY, size * 0.84, 'F3', color);\n      return;\n    }\n    const x = rightX - asset.displayWidth;\n    const imageY = baselineY - (asset.displayHeight * 0.32);\n    target.commands.push(\n      `q ${asset.displayWidth.toFixed(2)} 0 0 ${asset.displayHeight.toFixed(2)} ${x.toFixed(2)} ${imageY.toFixed(2)} cm /${asset.name} Do Q`,\n    );\n  };\n\n  let page!: PdfPage;\n  let y = PAGE_H - 112;",
          )

          replace_once(
              "    pdfLine(target, LEFT, 49, RIGHT, 49, [0.78, 0.75, 0.69], 0.55);",
              "    pdfLine(target, LEFT, 49, RIGHT, 49, FOUNTAIN_INK_BLUE, 0.55);",
          )

          replace_once(
              "  pdfHandwrittenCenteredText(page, headingLabel, y, 25.5, titleColor, COUNTRY_CITY_FONT, '400');\n  y -= 27;\n  pdfText(page, `Your journey so far - ${entries.length} saved ${entries.length === 1 ? 'place' : 'places'}.`, LEFT, y, 10, 'F1', MUTED);",
              "  pdfHandwrittenCenteredText(page, headingLabel, y, 27.5, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');\n  y -= 27;\n  pdfHandwrittenText(page, journeyLabel, LEFT, y, 10.4, MUTED, SCHOOLBELL_FONT, '400');\n  pdfHandwrittenRightText(page, journeyCount, RIGHT, y, 10.4, MUTED, SCHOOLBELL_FONT, '400');",
          )

          replace_once(
              "      pdfHandwrittenText(page, `My Atlas ${titleize(country)}`, LEFT, y, 20, titleColor, COUNTRY_CITY_FONT, '400');",
              "      pdfHandwrittenText(page, `My Atlas ${titleize(country)}`, LEFT, y, 21.5, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');",
          )

          replace_once(
              "      pdfHandwrittenText(page, titleize(city), LEFT, y, 16.5, titleColor, COUNTRY_CITY_FONT, '400');",
              "      pdfHandwrittenText(page, titleize(city), LEFT, y, 17.8, FOUNTAIN_INK_BLUE, COUNTRY_CITY_FONT, '400');",
          )

          replace_once(
              "  pdfLine(page, LEFT, y - 7, LEFT + 82, y - 7, [0.12, 0.12, 0.11], 0.42);",
              "  pdfLine(page, LEFT, y - 7, LEFT + 82, y - 7, FOUNTAIN_INK_BLUE, 0.42);",
          )

          path.write_text(text)
          PY
      - name: Remove one-off workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/apply-pdf-typography-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/summary/atlas-export-pdf.ts .github/workflows/apply-pdf-typography-pass.yml
          git commit -m "Style PDF headings and journey summary"
          git push origin HEAD:feat/pdf-ink-blue-schoolbell-summary
