name: Validate My Atlas FAB

on:
  push:
    branches: [master]
    paths:
      - 'src/components/shared/MakeYourOwnAtlas.astro'
      - 'src/features/trip/client.ts'
      - '.github/workflows/validate-my-atlas-fab.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run architecture-check
      - run: git diff --check
      - name: Remove validation workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-my-atlas-fab.yml
          git commit -m "Remove My Atlas FAB validation workflow"
          git push origin master
