name: Migrate city Hero asset contract

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/migrate-city-hero-contract.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migration
        run: node scripts/migrate-city-hero-contract.mjs

      - name: Regenerate content registry
        run: node scripts/regenerate-content-registry.mjs

      - name: Validate architecture and build
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:city-media

      - name: Remove one-time migration tooling
        run: |
          rm -f scripts/migrate-city-hero-contract.mjs
          rm -f .github/workflows/migrate-city-hero-contract.yml

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove stale city Hero media and country-scope assets'
          git push origin HEAD:master
