name: Repair canonical cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repair-cleanup-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair canonical data, Field Card data and stale tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { syncGenerationContract, tsModule } from './scripts/lib/city-pipeline.mjs';

          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          const writeGenerated = (draft) => fs.writeFileSync(`src/content/generated/${draft.country}/${draft.city}.ts`, tsModule(draft));

          const syncCity = (file, targets, thingsTarget) => {
            const draft = readJson(file);
            draft.cityData.categoryTargets = { ...targets };
            draft.cityData.manualLocks ??= {};
            for (const category of ['restaurants', 'cafes', 'accommodation', 'scooter-rental']) delete draft.cityData.manualLocks[`categoryTargets.${category}`];
            draft.cityData.manualLocks['categoryTargets.things-to-do'] = { value: thingsTarget, source: 'manual', locked: true };
            syncGenerationContract(draft);
            writeJson(file, draft);
            writeGenerated(draft);
            return draft;
          };

          syncCity('pipeline/cities/laos/don-det.json', { 'things-to-do': 11, restaurants: 12, cafes: 11, accommodation: 16 }, 11);
          syncCity('pipeline/cities/laos/tad-lo.json', { 'things-to-do': 14, restaurants: 12, cafes: 10, accommodation: 12 }, 14);
          const thakhek = syncCity('pipeline/cities/laos/thakhek.json', { 'things-to-do': 18, restaurants: 24, cafes: 25, accommodation: 21, 'scooter-rental': 5 }, 18);
          const park = thakhek.things.find((thing) => thing.id === 'thing-hin-nam-no-national-park');
          if (!park) throw new Error('Hin Nam No is missing from the Thakhek city draft.');
          park.isLandmark = true;
          writeJson('pipeline/cities/laos/thakhek.json', thakhek);
          writeGenerated(thakhek);

          const thakhekSource = readJson('pipeline/sources/laos/thakhek.json');
          const sourcePark = (thakhekSource.things ?? []).find((thing) => thing.id === 'thing-hin-nam-no-national-park');
          if (!sourcePark) throw new Error('Hin Nam No is missing from the Thakhek research source.');
          sourcePark.isLandmark = true;
          writeJson('pipeline/sources/laos/thakhek.json', thakhekSource);

          const editorialFile = 'src/content/field-card-editorial.json';
          const editorial = readJson(editorialFile);
          for (const id of ['thing-4000-islands-kayaking', 'thing-cycle-don-det-don-khon', 'thing-don-det-sunset']) {
            const entry = editorial[id];
            if (!entry || entry.secondaryStory !== null || !Array.isArray(entry.media) || entry.media.length < 2) {
              throw new Error(`${id}: expected a short Field Card with editorial media.`);
            }
            entry.media = entry.media.slice(0, 2);
          }
          writeJson(editorialFile, editorial);

          const replaceRequired = (file, from, to) => {
            const before = fs.readFileSync(file, 'utf8');
            if (!before.includes(from)) throw new Error(`${file}: expected migration text was not found: ${from.slice(0, 90)}`);
            fs.writeFileSync(file, before.replace(from, to));
          };

          const validatorFile = 'scripts/validate-field-card-content.mjs';
          replaceRequired(
            validatorFile,
            `  const coordinateGroups = new Map();\n  for (const thing of activeThings) {\n    const latitude = thing.coordinates?.latitude;\n    const longitude = thing.coordinates?.longitude;\n    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {\n      failures.push(\`${'${cityKey}'}/\${'${thing.id}'}: missing valid coordinates\`);\n      continue;\n    }\n    const key = \`${'${Number(latitude).toFixed(6)}'},\${'${Number(longitude).toFixed(6)}'}\`;\n    const ids = coordinateGroups.get(key) ?? [];\n    ids.push(thing.id);\n    coordinateGroups.set(key, ids);\n  }\n  for (const [coordinate, ids] of coordinateGroups) {\n    if (ids.length >= 3) failures.push(\`${'${cityKey}'}: probable placeholder coordinates \${'${coordinate}'} shared by \${'${ids.length}'} activities (\${'${ids.join(\', \')}'} )\`);\n  }\n\n`,
            ``,
          );
          replaceRequired(
            validatorFile,
            `  for (const thing of activeThings) {\n    const short = isShortFieldCard(thing.id);`,
            `  for (const thing of activeThings) {\n    const latitude = thing.coordinates?.latitude;\n    const longitude = thing.coordinates?.longitude;\n    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) failures.push(\`${'${cityKey}'}/\${'${thing.id}'}: missing valid coordinates\`);\n\n    const short = isShortFieldCard(thing.id);`,
          );

          replaceRequired('scripts/field-card-hero-tests.mjs', `const editorial = JSON.parse(readFileSync(new URL('../src/content/field-card-hero-copy.json', import.meta.url), 'utf8'));`, `const allEditorial = JSON.parse(readFileSync(new URL('../src/content/field-card-editorial.json', import.meta.url), 'utf8'));\nconst editorial = Object.fromEntries(Object.entries(allEditorial).flatMap(([id, value]) => value?.hero ? [[id, value.hero]] : []));`);
          replaceRequired('scripts/field-card-hero-tests.mjs', `assert.match(engine, /heroEditorial/, 'Manual editorial Hero overrides must be supported');`, `assert.match(engine, /getEditorialHero\\(thing\\.id\\)/, 'Canonical editorial Hero content must be supported');`);
          replaceRequired('scripts/field-card-hero-tests.mjs', `console.log(\`Field Card Hero tests passed: \${Object.keys(editorial).length} authored Hero override(s) validated.\`);`, `console.log(\`Field Card Hero tests passed: \${Object.keys(editorial).length} authored Hero entries validated.\`);`);

          replaceRequired('scripts/field-card-quick-read-tests.mjs', `const editorial = JSON.parse(readFileSync(new URL('../src/content/field-card-quick-read-copy.json', import.meta.url), 'utf8'));`, `const allEditorial = JSON.parse(readFileSync(new URL('../src/content/field-card-editorial.json', import.meta.url), 'utf8'));\nconst editorial = Object.fromEntries(Object.entries(allEditorial).flatMap(([id, value]) => value?.quickRead ? [[id, value.quickRead]] : []));`);
          replaceRequired('scripts/field-card-quick-read-tests.mjs', `assert.match(engine, /quickReadEditorial/, 'Manual editorial Quick Read overrides must be supported');`, `assert.match(engine, /getEditorialQuickRead\\(thing\\.id\\)/, 'Canonical editorial Quick Read content must be supported');`);
          replaceRequired('scripts/field-card-quick-read-tests.mjs', `console.log(\`Field Card Quick Read tests passed: \${Object.keys(editorial).length} authored Quick Read override(s) validated.\`);`, `console.log(\`Field Card Quick Read tests passed: \${Object.keys(editorial).length} authored Quick Read entries validated.\`);`);

          replaceRequired('scripts/field-card-story-block-tests.mjs', `const editorial = JSON.parse(readFileSync(new URL('../src/content/field-card-primary-story-copy.json', import.meta.url), 'utf8'));`, `const allEditorial = JSON.parse(readFileSync(new URL('../src/content/field-card-editorial.json', import.meta.url), 'utf8'));\nconst editorial = Object.fromEntries(Object.entries(allEditorial).flatMap(([id, value]) => value?.primaryStory ? [[id, value.primaryStory]] : []));`);
          replaceRequired('scripts/field-card-story-block-tests.mjs', `assert.match(engine, /primaryStoryEditorial/, 'View engine must support editorial primary-story overrides');`, `assert.match(engine, /getEditorialPrimaryStory\\(thing\\.id\\)/, 'View engine must support canonical editorial primary-story content');`);
          replaceRequired('scripts/field-card-story-block-tests.mjs', `console.log(\`Field Card primary story contract passed: \${Object.keys(editorial).length} authored override(s) validated.\`);`, `console.log(\`Field Card primary story contract passed: \${Object.keys(editorial).length} authored entries validated.\`);`);
          replaceRequired('scripts/field-card-story-block-tests.mjs', `Story block must render authored chapter labels while retaining legacy fallback compatibility`, `Story block must render authored chapter labels while retaining section fallback compatibility`);

          replaceRequired('scripts/field-card-secondary-story-tests.mjs', `const editorial = JSON.parse(readFileSync(new URL('../src/content/field-card-secondary-story-copy.json', import.meta.url), 'utf8'));`, `const allEditorial = JSON.parse(readFileSync(new URL('../src/content/field-card-editorial.json', import.meta.url), 'utf8'));\nconst editorial = Object.fromEntries(Object.entries(allEditorial).flatMap(([id, value]) => value?.secondaryStory ? [[id, value.secondaryStory]] : []));`);
          replaceRequired('scripts/field-card-secondary-story-tests.mjs', `assert.match(engine, /secondaryStoryEditorial/, 'View engine must support editorial secondary-story overrides');`, `assert.match(engine, /getEditorialSecondaryStory\\(thing\\.id\\)/, 'View engine must support canonical editorial secondary-story content');`);
          replaceRequired('scripts/field-card-secondary-story-tests.mjs', `assert.match(engine, /fallbackSecondaryStory/, 'Legacy activities must retain a deterministic secondary-story fallback');`, `assert.match(engine, /fallbackSecondaryStory/, 'Activities without authored secondary story must retain a deterministic fallback');`);
          replaceRequired('scripts/field-card-secondary-story-tests.mjs', `assert.match(engine, /slice\\(primaryLegacyOffset \\+ 2\\)/, 'Legacy sections 03 and 04 must both be consumed before remaining sections render');`, `assert.match(engine, /slice\\(primarySectionOffset \\+ 2\\)/, 'Source sections 03 and 04 must both be consumed before remaining sections render');`);
          replaceRequired('scripts/field-card-secondary-story-tests.mjs', `console.log(\`Field Card secondary story contract passed: \${Object.keys(editorial).length} authored override(s) validated.\`);`, `console.log(\`Field Card secondary story contract passed: \${Object.keys(editorial).length} authored entries validated.\`);`);

          replaceRequired('scripts/field-card-practical-tests.mjs', `assert.match(engine, /field-card-practical-copy\\.json/, 'Field Card engine must expose a reviewed practical editorial layer');`, `assert.match(engine, /getEditorialPractical\\(thing\\.id\\)/, 'Field Card engine must expose canonical practical editorial content');`);
          replaceRequired('scripts/field-card-practical-tests.mjs', `Compatibility fallback may expose cost only for paid activities`, `Generic fallback may expose cost only for paid activities`);
          replaceRequired('scripts/field-card-practical-tests.mjs', `Compatibility fallback must not manufacture a cost note for free activities`, `Generic fallback must not manufacture a cost note for free activities`);

          replaceRequired('scripts/field-card-faq-tests.mjs', `const editorialFaq = JSON.parse(readFileSync(new URL('../src/content/field-card-faq-copy.json', import.meta.url), 'utf8'));`, `const allEditorial = JSON.parse(readFileSync(new URL('../src/content/field-card-editorial.json', import.meta.url), 'utf8'));\nconst editorialFaq = Object.fromEntries(Object.entries(allEditorial).flatMap(([id, value]) => Array.isArray(value?.faq) ? [[id, value.faq]] : []));`);
          replaceRequired('scripts/field-card-faq-tests.mjs', `assert.match(engine, /field-card-faq-copy\\.json/, 'Field Card engine must expose a reviewed FAQ editorial layer');`, `assert.match(engine, /getEditorialFaq\\(thing\\.id\\)/, 'Field Card engine must expose canonical FAQ editorial content');`);
          replaceRequired('scripts/field-card-faq-tests.mjs', `assert.match(engine, /completeFaq\\(editorialFaq\\[thing\\.id\\]\\)/, 'Reviewed FAQ copy must take precedence over generated FAQ content');`, `assert.match(engine, /completeFaq\\(getEditorialFaq\\(thing\\.id\\)\\)/, 'Canonical FAQ content must take precedence over generated FAQ content');`);

          const engineFile = 'src/engines/field-card/field-card-engine.ts';
          let engine = fs.readFileSync(engineFile, 'utf8');
          if (!engine.includes('const legacy = thing.fieldCard.sections ?? [];')) throw new Error('Field Card engine section fallback marker not found.');
          engine = engine.replace('const legacy = thing.fieldCard.sections ?? [];', 'const sourceSections = thing.fieldCard.sections ?? [];').replaceAll('legacy[', 'sourceSections[').replaceAll('legacySections', 'sourceSections').replaceAll('primaryLegacyOffset', 'primarySectionOffset');
          fs.writeFileSync(engineFile, engine);

          fs.rmSync('verify-cleanup.log', { force: true });
          fs.rmSync('repair-cleanup.log', { force: true });
          NODE

          node scripts/regenerate-content-registry.mjs

      - name: Verify repaired repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:city-template 2>&1 | tee repair-verify.log

      - name: Persist only failure diagnostics
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          cp repair-verify.log /tmp/repair-verify.log
          git reset --hard HEAD
          cp /tmp/repair-verify.log repair-cleanup.log
          rm .github/workflows/repair-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record canonical cleanup repair failure"
          git push origin HEAD:master
          exit 1

      - name: Commit verified repair
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm repair-verify.log
          rm .github/workflows/repair-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair canonical cleanup and restore pipeline"
          git push origin HEAD:master
