name: Atlas Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify universal pipeline and Don Det pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: One-time normalize Thakhek SPA tags
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Materialize Thakhek')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'pipeline/sources/laos/thakhek.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const replacements = new Map([
            ['450 km loop', '450 km'],
            ['Loop day one', 'Day one'],
            ['Loop day two', 'Day two'],
          ]);
          for (const thing of data.things ?? []) {
            if (!Array.isArray(thing?.spaCard?.handwrittenTags)) continue;
            thing.spaCard.handwrittenTags = thing.spaCard.handwrittenTags.map((tag) => replacements.get(tag) ?? tag);
          }
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: One-time materialize Thakhek through the real generator
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Materialize Thakhek')
        run: npm run generate-city -- laos thakhek

      - name: Verify universal city template and pipeline
        run: npm run verify:city-template

      - name: Persist generated Thakhek output
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Materialize Thakhek')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/sources/laos/thakhek.json pipeline/cities/laos/thakhek.json src/content/generated/laos/thakhek.ts src/content/generated/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Generate Thakhek city content"
            git push
          fi
