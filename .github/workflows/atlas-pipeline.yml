name: Atlas Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify universal pipeline and Don Det pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify universal city template
        run: npm run verify:city-template

      - name: Run Don Det 11-activity pilot
        run: npm run pilot:don-det-activities
