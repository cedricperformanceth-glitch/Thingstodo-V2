name: Atlas Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify universal Atlas pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: One-time remove legacy photo research and import Xe Bang Fai Field Card text
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Simplify Atlas photo pipeline')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { tsModule } from './scripts/lib/city-pipeline.mjs';

          const citiesRoot = 'pipeline/cities';
          for (const relative of fs.readdirSync(citiesRoot, { recursive: true }).map(String).filter((file) => file.endsWith('.json'))) {
            const file = path.join(citiesRoot, relative);
            const draft = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const entity of [...(draft.places ?? []), ...(draft.things ?? [])]) {
              delete entity.firstPartySources;
              if (entity.media?.research?.firstPartyPhotoLeads) delete entity.media.research.firstPartyPhotoLeads;
              if (entity.media?.research && Object.keys(entity.media.research).length === 0) delete entity.media.research;
              if (Array.isArray(entity.researchSources)) entity.researchSources = entity.researchSources.filter((source) => source?.purpose !== 'first-party');
            }
            fs.writeFileSync(file, `${JSON.stringify(draft, null, 2)}\n`);
            const country = draft.country;
            const city = draft.city;
            const moduleFile = path.join('src/content/generated', country, `${city}.ts`);
            fs.mkdirSync(path.dirname(moduleFile), { recursive: true });
            fs.writeFileSync(moduleFile, tsModule(draft));
          }

          const sourceFile = 'pipeline/sources/laos/thakhek.json';
          const source = JSON.parse(fs.readFileSync(sourceFile, 'utf8'));
          const xe = source.things.find((thing) => thing.id === 'thing-xe-bang-fai-cave');
          if (!xe) throw new Error('Xe Bang Fai source entry not found.');
          xe.longDescription = 'Xe Bang Fai is a remote river-cave expedition, not a casual roadside attraction. The final roads, local guide, boat journey and changing water conditions all need to be organised before arrival.';
          xe.whyGo = 'Remote adventure and guided cave travel.';
          xe.practical = 'Budget: Around 50,000 kip entry · boat extra. Duration: Full day minimum · often multi-day.';
          delete xe.access;
          xe.notes = 'The road is part of the expedition. Confirm the river before leaving.';
          xe.sections = [
            {
              title: 'The long road from Thakhek',
              body: 'From Thakhek, follow Highway 12 east for about 130 km toward the Vietnamese border. At Nongchan, turn right: the paved road ends here and the dirt road begins. Continue toward Ban Xoang and then Bualapha. Between these villages you reach the Xe Bang Fai River; cross by ferry, with a motorbike crossing reported at around 15,000 kip. Once in Bualapha, continue toward Ban Natoy, then Ban Gnavet and Ban Kouankaphoung. From Ban Natoy onward, the smaller villages and tracks may be easier to follow with an offline map such as Maps.me. At Ban Kouankaphoung the road forks: take the right-hand track and continue to the end of the road for the cave entrance. The final roads are remote and can be rough, so leave enough daylight, arrange a local guide and reconfirm the route, ferry and access conditions before departure.'
            },
            {
              title: 'What the expedition costs',
              body: 'Recent visitor reports put the entrance at around 50,000 kip per person, with motorbike parking around 10,000 kip. A small local boat has recently been reported at around 150,000 kip, while larger boats may cost more depending on the group. The boat is the part of the visit worth making room for: once you leave the riverbank and move into the darkness, the scale of Xe Bang Fai really begins to make sense. Prices and boat capacity can change between seasons, so treat these figures as a useful reference and confirm the current rate at the park office when you arrive.'
            },
            {
              title: 'Day trip or overnight?',
              body: 'The cave journey itself may take one to two hours, but the remote approach turns it into a full-day or multi-day plan. Keep margin for road conditions, the walk to the river and local coordination. Do not attach a fixed evening arrival elsewhere to the same day.'
            },
            {
              title: 'Let the river and season decide',
              body: 'Confirm river levels and boat access locally. Wear quick-dry clothing and shoes with grip, use the supplied life jacket and carry a strong headlamp. Do not enter the cave or surrounding forest route without a guide.'
            }
          ];
          fs.writeFileSync(sourceFile, `${JSON.stringify(source, null, 2)}\n`);

          const readmeFile = 'pipeline/README.md';
          let readme = fs.readFileSync(readmeFile, 'utf8');
          const start = readme.indexOf('### SPA photo discovery');
          const end = readme.indexOf('### Reuse/licensing policy');
          if (start !== -1 && end > start) {
            const photoSection = `### SPA photo discovery\n\nAutomatic photo discovery is deliberately limited to the Wikimedia Commons API. Atlas checks exact-entity metadata, file dimensions, source URL, author and a commercially compatible licence before a Commons image can fill the SPA photo slot. No Openverse, Flickr, social-network, official-site, booking-platform or generic web-image crawler is part of automatic generation.\n\nIf Commons returns no qualified image, the correct result is \`Photo to add\` for later manual completion. A future Google/Places photo integration can be added separately if the project adopts the appropriate API and usage terms. \`--skip-photo-discovery\` or \`ATLAS_OFFLINE=1\` disables the Commons request. Things to do may retain additional qualified Commons results from the same query in \`media.research.activityPhotoReserve\` for the future universal Field Card layout.\n\n`;
            readme = `${readme.slice(0, start)}${photoSection}${readme.slice(end)}`;
            readme = readme.replace(/- Openverse: useful discovery index; keep the original source page and verify reuse metadata before final editorial approval;\n/g, '').replace(/- Flickr: use the official API only when configured appropriately and respect the individual photo licence and Flickr API terms;\n/g, '');
            fs.writeFileSync(readmeFile, readme);
          }
          NODE
          npm run generate-city -- laos thakhek --skip-photo-discovery
          npm run regenerate-registry

      - name: Verify universal city template and pipeline
        run: npm run verify:city-template

      - name: Persist one-time photo cleanup and Xe Bang Fai content
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Simplify Atlas photo pipeline')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/README.md pipeline/sources/laos/thakhek.json pipeline/cities src/content/generated
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Atlas after Commons-only photo cleanup"
            git push
          fi
