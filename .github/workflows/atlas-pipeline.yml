name: Atlas Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify universal pipeline and Don Det pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify universal city template and pipeline
        run: npm run verify:city-template

      - name: One-time Don Det first-party discovery audit
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Run Don Det first-party discovery audit')
        run: npm run audit:first-party -- laos don-det
