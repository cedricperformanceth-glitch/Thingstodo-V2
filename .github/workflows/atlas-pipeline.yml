name: Atlas Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify universal pipeline and Don Det pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Don Det full SPA sources
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Fill Don Det full SPA sources')
        run: npm run generate-city -- laos don-det

      - name: Verify universal city template and pipeline
        run: npm run verify:city-template

      - name: Commit generated Don Det city
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Fill Don Det full SPA sources')
        run: |
          if git diff --quiet; then
            echo 'No generated Don Det changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/cities/laos/don-det.json src/content/generated/laos/don-det.ts src/content/generated/index.ts
          git commit -m 'Materialize Don Det full SPA'
          git push
