name: Finalize My Atlas Button

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/finalize-my-atlas-button.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Move widget to true bottom-left edge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/shared/MakeYourOwnAtlas.astro')
          s = p.read_text()
          s = s.replace('    left: clamp(.65rem, 1.5vw, 1.25rem);\n    bottom: clamp(.7rem, 1.8vw, 1.35rem);', '    left: .12rem;\n    bottom: .12rem;', 1)
          s = s.replace('      left: .55rem;\n      bottom: .65rem;', '      left: .08rem;\n      bottom: .1rem;', 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run architecture-check
      - run: git diff --check
      - name: Commit final geometry and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/shared/MakeYourOwnAtlas.astro
          git commit -m "Anchor My Atlas button to bottom left"
          git rm .github/workflows/finalize-my-atlas-button.yml
          git commit -m "Remove My Atlas final geometry workflow"
          git push origin master