name: Finalize PDF footer divider

on:
  push:
    branches:
      - feat/pdf-ink-blue-schoolbell-summary

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-ink-blue-schoolbell-summary
      - name: Keep blue footer divider final-page only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/summary/atlas-export-pdf.ts')
          text = path.read_text()
          old = "  const addFooter = (target: PdfPage, pageNumber: number) => {\n    pdfLine(target, LEFT, 49, RIGHT, 49, FOUNTAIN_INK_BLUE, 0.55);"
          new = "  const addFooter = (\n    target: PdfPage,\n    pageNumber: number,\n    dividerColor: [number, number, number] = [0.78, 0.75, 0.69],\n  ) => {\n    pdfLine(target, LEFT, 49, RIGHT, 49, dividerColor, 0.55);"
          if old not in text:
              raise SystemExit('Footer function block not found')
          text = text.replace(old, new, 1)
          old = "  addFooter(page, pages.length);\n\n  const objects: string[] = [''];"
          new = "  addFooter(page, pages.length, FOUNTAIN_INK_BLUE);\n\n  const objects: string[] = [''];"
          if old not in text:
              raise SystemExit('Final footer call not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-off workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/finalize-pdf-footer-divider.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/summary/atlas-export-pdf.ts .github/workflows/finalize-pdf-footer-divider.yml
          git commit -m "Keep ink-blue footer divider on final PDF page"
          git push origin HEAD:feat/pdf-ink-blue-schoolbell-summary
