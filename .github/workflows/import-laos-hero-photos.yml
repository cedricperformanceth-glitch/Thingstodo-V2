name: Import Laos Hero photos

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-laos-hero-photos.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Import exact V1 Hero photos
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const root = process.cwd();
          const rawBase = 'https://raw.githubusercontent.com/cedricperformanceth-glitch/thingstodoatlas/master';
          const photos = [
            { city: 'don-det', source: `${rawBase}/public/images/laos/don-det.webp`, copy: true },
            { city: 'luang-prabang', source: `${rawBase}/public/images/laos/luang-prabang.webp`, copy: true },
            { city: 'pakse', source: `${rawBase}/public/images/laos/pakse.webp`, copy: true },
            { city: 'tad-lo', source: `${rawBase}/public/images/laos/tad-lo.webp`, copy: true },
            { city: 'thakhek', source: `${rawBase}/public/images/places/thakhek-01.webp`, copy: true },
            { city: 'vang-vieng', source: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Nam_song_river_vang_vieng.jpg?width=1600', copy: false },
            { city: 'vientiane', source: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/That_Louang_Vientiane.jpg?width=1600', copy: false },
          ];

          for (const photo of photos) {
            const response = await fetch(photo.source, {
              redirect: 'follow',
              headers: { 'User-Agent': 'ThingsToDoAtlas/1.0 (legacy asset localization)' },
            });
            if (!response.ok) throw new Error(`${photo.city}: ${response.status} ${response.statusText}`);

            const input = Buffer.from(await response.arrayBuffer());
            const dir = path.join(root, 'public', 'assets', 'cities', 'laos', photo.city, 'hero', 'photos');
            const target = path.join(dir, `${photo.city}-hero-photo.webp`);
            fs.mkdirSync(dir, { recursive: true });

            if (photo.copy) {
              fs.writeFileSync(target, input);
            } else {
              await sharp(input).webp({ quality: 92, effort: 6 }).toFile(target);
            }

            const output = fs.readFileSync(target);
            const metadata = await sharp(output).metadata();
            if (metadata.format !== 'webp' || !metadata.width || !metadata.height) {
              throw new Error(`${photo.city}: invalid localized WebP`);
            }
            const hash = crypto.createHash('sha256').update(output).digest('hex').slice(0, 12);
            console.log(`${photo.city}: ${metadata.width}x${metadata.height} ${output.length} bytes sha256:${hash}`);
          }
          NODE
      - name: Remove temporary workflow
        run: rm -f .github/workflows/import-laos-hero-photos.yml
      - name: Commit imported photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Import legacy Laos Hero photos'
          git push origin HEAD:master
