        shell: bash
        run: |
          rm .github/workflows/luang-prabang-activity-completion-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cities/laos/luang-prabang.json src/content/generated/laos/luang-prabang.ts src/content/field-card-editorial.json luang-prabang-activity-completion.log .github/workflows/luang-prabang-activity-completion-once.yml
