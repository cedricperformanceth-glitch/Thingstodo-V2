          const stripHtml = (value = '') => String(value)
            .replace(/<[^>]*>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#0?39;/g, "'")
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          const normalizeText = (value = '') => stripHtml(value).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
          const normalizeLicense = (value = '') => {
            const license = normalizeText(value);
            if (license.includes('cc by sa')) return 'cc-by-sa';
            if (license.includes('cc by')) return 'cc-by';
            if (license.includes('cc0')) return 'cc0';
            if (license.includes('public domain') || license === 'pd') return 'public-domain';
            return null;
          };
          const cleanAuthor = (value = '') => {
            const text = stripHtml(value);
            if (/supanut arunoprayote/i.test(text)) return 'Supanut Arunoprayote';
            return text.replace(/\s*\(talk\).*$/i, '').trim();
          };
          const matchesConfig = (page, config) => {
            const info = page.imageinfo?.[0];
            const haystack = normalizeText([page.title, info?.extmetadata?.ObjectName?.value, info?.extmetadata?.ImageDescription?.value, info?.extmetadata?.Categories?.value].filter(Boolean).join(' '));
            const mustOk = !config.must?.length || config.must.some((term) => haystack.includes(normalizeText(term)));
            const oneOfOk = !config.oneOf?.length || config.oneOf.some((term) => haystack.includes(normalizeText(term)));
            return mustOk && oneOfOk;
          };
          const makeAsset = (page, thingName) => {
            const info = page.imageinfo?.[0];
            if (!info) return null;
            const license = normalizeLicense(info.extmetadata?.LicenseShortName?.value);
            if (!license) return null;
            const width = Number(info.width ?? info.thumbwidth ?? 0);
            const height = Number(info.height ?? info.thumbheight ?? 0);
            if (Math.max(width, height) < 640 || Math.min(width, height) < 400) return null;
            const author = cleanAuthor(info.extmetadata?.Artist?.value);
            if (!author) return null;
            return {
              id: `commons-${page.pageid}`,
              src: info.thumburl ?? info.url,
              alt: stripHtml(info.extmetadata?.ImageDescription?.value || info.extmetadata?.ObjectName?.value || `${thingName} in Luang Prabang`),
              sourceType: 'wikimedia',
              sourceUrl: page.canonicalurl,
              sourceName: 'Wikimedia Commons',
              author,
              license,
              manual: false,
              locked: false
            };
          };
          const searchCommons = async (query, config, thingName) => {
            const params = new URLSearchParams({
              action: 'query', format: 'json', formatversion: '2', generator: 'search',
              gsrnamespace: '6', gsrlimit: '24', gsrsearch: query,
              prop: 'info|imageinfo', inprop: 'url', iiprop: 'url|size|extmetadata', iiurlwidth: '1920'
            });
            const response = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`, { headers: { 'User-Agent': 'ThingsToDoAtlas/2.0 Luang-Prabang activity media completion' } });
            if (!response.ok) return [];
            const payload = await response.json();
            return (payload.query?.pages ?? []).filter((page) => matchesConfig(page, config)).map((page) => makeAsset(page, thingName)).filter(Boolean);
          };

          const mediaReport = [];
          for (const [thingId, config] of Object.entries(configs)) {
            const thing = draft.things.find((entry) => entry.id === thingId);
            if (!thing) throw new Error(`Missing Luang Prabang activity: ${thingId}`);
            if (thing.media?.card?.image?.locked) {
              mediaReport.push(`${thingId}: preserved locked media`);
            } else {
              const found = [];
              const seen = new Set();
              for (const query of config.queries) {
                for (const asset of await searchCommons(query, config, thing.name)) {
                  if (!seen.has(asset.sourceUrl)) { seen.add(asset.sourceUrl); found.push(asset); }
                }
                if (found.length >= 3) break;
              }
              const selected = found.slice(0, 3);
              thing.media ??= {};
              thing.media.card ??= {};
              thing.media.fieldCard ??= { gallery: [] };
              if (selected.length) {
                thing.media.card.image = selected[0];
                thing.media.fieldCard.gallery = selected;
                thing.spaCard.photoStatus = 'verified';
                thing.spaCard.photoRequiresManualFill = false;
              } else {
                delete thing.media.card.image;
                thing.media.fieldCard.gallery = [];
                thing.spaCard.photoStatus = 'missing';
                thing.spaCard.photoRequiresManualFill = true;
              }
              mediaReport.push(`${thingId}: ${selected.length} verified Commons image(s)`);
            }

            const q = config.quickRead;
            const spa = config.spa;
            const selectedMedia = thing.media?.fieldCard?.gallery ?? [];
            editorial[thingId] = {
              ...(editorial[thingId] ?? {}),
              faq: config.faq.map(([question, answer]) => ({ question, answer })),
              hero: config.hero,
              media: selectedMedia.map((asset) => ({ ...asset, manual: true, locked: true })),
              practical: { items: config.practical.map(([label, value, detail]) => ({ label, value, detail })) },
              primaryStory: {
                chapters: config.chapters.map(([label, title, body]) => ({ label, title, body })),
                note: { label: 'FIELD NOTE', text: config.hero.rhythmNote }
              },
              quickRead: {
                time: { primary: q.time[0], secondary: q.time[1] },
                route: { primary: q.route[0], secondary: q.route[1] },
                budget: { primary: q.budget[0], secondary: q.budget[1] },
                bestFor: { primary: q.bestFor[0], secondary: q.bestFor[1] }
              },
              secondaryStory: null,
              seo: {
                title: config.seo[0], description: config.seo[1],
                ...(selectedMedia[0]?.src ? { image: selectedMedia[0].src } : {})
              },
              sources: config.sources.map(([sourceName, sourceUrl, purpose]) => ({ sourceName, sourceUrl, purpose })),
              spa: {
                description: spa[0], handwrittenTags: spa[1], gettingThere: spa[2], duration: spa[3], costType: spa[4], bestTime: spa[5]
              }
            };
          }

          fs.writeFileSync(sourceFile, `${JSON.stringify(draft, null, 2)}\n`);
          fs.writeFileSync(generatedFile, tsModule(draft));
          fs.writeFileSync(editorialFile, `${JSON.stringify(editorial, null, 2)}\n`);
          fs.writeFileSync('luang-prabang-activity-completion.log', `${mediaReport.join('\n')}\n`);
          console.log(mediaReport.join('\n'));
          NODE

