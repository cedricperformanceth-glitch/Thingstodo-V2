name: Complete Luang Prabang activities once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/luang-prabang-activity-completion-once.yml'

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Complete Luang Prabang activity media and Field Cards
