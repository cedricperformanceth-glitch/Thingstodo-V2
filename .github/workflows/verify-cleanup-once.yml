name: Verify cleaned Atlas repository

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-cleanup-once.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete Atlas verification
        run: npm run verify:city-template

      - name: Remove completed verification workflow
        run: |
          rm .github/workflows/verify-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove completed cleanup verification"
          git push origin HEAD:master
