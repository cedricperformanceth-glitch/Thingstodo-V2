name: Apply universal Hero photo

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-universal-hero-photo.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Apply Hero photo and facts architecture
        run: |
          cat > src/engines/hero/hero-assets.ts <<'EOF'
          import type { City } from '../../core/models/types';

          /**
           * City Hero artwork follows one public asset convention. Country + city slug
           * form the canonical identity; supplying the files is enough to wire the Hero.
           */
          export const getCityHeroAssets = (city: City) => {
            const { country, slug } = city;
            const base = `/assets/cities/${country}/${slug}/hero`;

            return {
              stamp: `${base}/stamps/${slug}-hero-stamp.webp`,
              drawing: `${base}/drawings/${slug}-hero-drawing.webp`,
              photo: `${base}/photos/${slug}-hero-photo.webp`,
            };
          };
          EOF

          cat > src/content/city-hero-facts.ts <<'EOF'
          /**
           * Editorial facts already validated in the original Laos Heroes.
           * Every other destination falls back to its City.hero.facts data.
           */
          export const cityHeroFactOverrides: Readonly<Record<string, readonly string[]>> = {
            'laos/don-det': ['August 2026', 'Bicycle island base', 'Tropical Mekong', 'Si Phan Don'],
            'laos/luang-prabang': ['August 2026', 'UNESCO old town', 'Tropical monsoon', 'Luang Prabang Province'],
            'laos/pakse': ['July 2026', 'Road-trip base', 'Tropical climate', 'Southern Laos'],
            'laos/tad-lo': ['July 2026', 'Walkable village base', 'Waterfalls & coffee', 'Salavan Province'],
            'laos/thakhek': ['July 2026', 'Loop road base', 'Limestone & caves', 'Khammouane Province'],
            'laos/vang-vieng': ['August 2026', 'River & karst base', 'Tropical monsoon', 'Vientiane Province'],
            'laos/vientiane': ['August 2026', 'Capital city base', 'Tropical monsoon', 'Mekong riverfront'],
          };
          EOF

          cat > src/engines/hero/hero-facts.ts <<'EOF'
          import type { City, HeroFact } from '../../core/models/types';
          import { cityHeroFactOverrides } from '../../content/city-hero-facts';

          export type CityHeroFactIcon = 'calendar' | 'road' | 'climate' | 'location';
          export interface CityHeroDisplayFact { icon: CityHeroFactIcon; text: string; }

          const slots: Array<{ icon: CityHeroFactIcon; pattern: RegExp; fallbackIndex: number }> = [
            { icon: 'calendar', pattern: /date|updated|season|month|year|when/i, fallbackIndex: 0 },
            { icon: 'road', pattern: /road|base|setting|best for|profile|pace|transport|access/i, fallbackIndex: 1 },
            { icon: 'climate', pattern: /climate|weather|terrain|landscape|environment/i, fallbackIndex: 2 },
            { icon: 'location', pattern: /location|province|region|district|area/i, fallbackIndex: 3 },
          ];

          const titleCaseSlug = (value: string) => value.split('-').map((part) => part ? `${part[0].toUpperCase()}${part.slice(1)}` : part).join(' ');
          const factText = (fact?: HeroFact) => fact?.value?.trim() || fact?.label?.trim() || '';

          const generatedFacts = (city: City): string[] => {
            const source = city.hero.facts;
            const used = new Set<number>();

            const pick = (pattern: RegExp, fallbackIndex: number) => {
              const semanticIndex = source.findIndex((fact, index) => !used.has(index) && pattern.test(fact.label));
              const index = semanticIndex >= 0
                ? semanticIndex
                : source.findIndex((fact, candidateIndex) => candidateIndex >= fallbackIndex && !used.has(candidateIndex) && factText(fact));
              if (index < 0) return '';
              used.add(index);
              return factText(source[index]);
            };

            const values = slots.map(({ pattern, fallbackIndex }) => pick(pattern, fallbackIndex));
            if (!values[0]) values[0] = city.hero.eyebrow.trim() || 'Atlas field notes';
            if (!values[1]) values[1] = `${titleCaseSlug(city.profile)} travel base`;
            if (!values[2]) values[2] = city.hero.subtitle.trim() || 'Local conditions';
            if (!values[3]) values[3] = `${city.name}, ${titleCaseSlug(city.country)}`;
            return values;
          };

          /**
           * Four fixed semantic slots keep one visual language everywhere.
           * Laos retains its validated V1 copy; future cities are populated from
           * City.hero.facts without destination-specific component logic.
           */
          export const getCityHeroFacts = (city: City): CityHeroDisplayFact[] => {
            const key = `${city.country}/${city.slug}`;
            const values = cityHeroFactOverrides[key] ?? generatedFacts(city);
            return slots.map(({ icon }, index) => ({ icon, text: values[index] ?? '' }));
          };
          EOF

          cat > src/engines/hero/hero-engine.ts <<'EOF'
          import type { City } from '../../core/models/types';
          import { cityPresentation } from '../spa/city-presentation';
          import { getCityHeroAssets } from './hero-assets';
          import { getCityHeroCopy } from './hero-copy';
          import { getCityHeroFacts } from './hero-facts';

          export const getHero = (city: City) => ({
            ...city.hero,
            profile: city.profile,
            presentation: cityPresentation[city.profile],
            cityAssets: getCityHeroAssets(city),
            copy: getCityHeroCopy(city),
            displayFacts: getCityHeroFacts(city),
          });
          EOF

          cat > src/components/hero/CityHero.astro <<'EOF'
          ---
          import type { City } from '../../core/models/types';
          import { getHero } from '../../engines/hero/hero-engine';
          import CityHeroEnvelope from './CityHeroEnvelope.astro';

          interface Props { city: City; }
          const { city } = Astro.props;
          const hero = getHero(city);
          ---

          <section class="city-hero" aria-labelledby="city-title">
            <h1 id="city-title" class="city-hero__title">{hero.title}</h1>
            <div class="city-hero__layout">
              <CityHeroEnvelope
                stampSrc={hero.cityAssets.stamp}
                photoSrc={hero.cityAssets.photo}
                facts={hero.displayFacts}
                cityName={city.name}
                messageLines={hero.copy.messageLines}
              />
              <div class="city-hero__drawing-area" aria-hidden="true">
                <figure class="city-hero__drawing">
                  <img class="city-hero__drawing-image" src={hero.cityAssets.drawing} alt="" />
                  {hero.copy.drawingCaption && <figcaption>{hero.copy.drawingCaption}</figcaption>}
                </figure>
              </div>
            </div>
          </section>

          <style>
            .city-hero {
              position: relative;
              width: calc(100vw - 2rem);
              max-width: none;
              margin-top: -2rem;
              margin-left: calc(50% - 50vw + 1rem);
              padding: clamp(5.6rem, 7vw, 6.8rem) 0 clamp(2.1rem, 3vw, 3rem);
            }

            .city-hero__layout {
              display: grid;
              grid-template-columns: clamp(43rem, calc(132vw - 45rem), 58rem) minmax(17rem, 18.25rem);
              align-items: center;
              justify-content: start;
              gap: clamp(.8rem, 1.35vw, 1.25rem);
            }

            .city-hero__title {
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0 0 0 0);
              white-space: nowrap;
            }

            .city-hero__drawing-area {
              display: flex;
              width: 18.25rem;
              align-items: center;
              justify-content: center;
            }

            .city-hero__drawing {
              width: 18rem;
              max-width: 100%;
              margin: 0 auto;
              pointer-events: none;
              transform: rotate(-2deg);
            }

            .city-hero__drawing-image {
              display: block;
              width: 100%;
              height: auto;
              object-fit: contain;
            }

            .city-hero__drawing figcaption {
              margin: 0;
              color: rgba(31, 57, 45, .58);
              font-family: 'Segoe Print', 'Bradley Hand', cursive;
              font-size: .66rem;
              letter-spacing: .02em;
              text-align: center;
              transform: rotate(1deg);
            }

            @media (min-width: 981px) {
              .city-hero__drawing figcaption { font-size: .59rem; }
            }

            @media (max-width: 980px) {
              .city-hero__layout { grid-template-columns: 1fr; gap: 1.25rem; }
              .city-hero__drawing-area { margin-inline: auto; }
            }

            @media (max-width: 760px) {
              .city-hero { padding-top: 4.3rem; }
              .city-hero__drawing-area { width: min(16.5rem, 88vw); }
              .city-hero__drawing { width: 100%; }
            }
          </style>
          EOF

          cat > src/components/hero/CityHeroEnvelope.astro <<'EOF'
          ---
          import type { CityHeroDisplayFact } from '../../engines/hero/hero-facts';

          interface Props {
            stampSrc: string;
            photoSrc: string;
            facts: CityHeroDisplayFact[];
            cityName: string;
            messageLines: string[];
          }

          const { stampSrc, photoSrc, facts, cityName, messageLines } = Astro.props;
          const envelopeSource = '/assets/shared/hero/envelope/airmail-postcard-template.webp';
          ---

          <div class="city-hero-envelope" aria-hidden="true" style={`--city-hero-envelope-source: url("${envelopeSource}")`}>
            <span class="city-hero-envelope__base"></span>

            <div class="city-hero-envelope__media-frame">
              <div class="city-hero-envelope__media">
                <figure class="city-hero-envelope__photo">
                  <img src={photoSrc} alt="" width="1600" height="1100" fetchpriority="high" />
                </figure>

                <div class="city-hero-envelope__facts">
                  {facts.map((fact) => (
                    <span>
                      {fact.icon === 'calendar' && (
                        <svg viewBox="0 0 18 18"><rect x="3" y="4" width="12" height="11" rx="1.2"/><path d="M6 2.5v3M12 2.5v3M3 7h12"/></svg>
                      )}
                      {fact.icon === 'road' && (
                        <svg viewBox="0 0 18 18"><rect x="3" y="4" width="12" height="8" rx="1.5"/><path d="M5 12v2M13 12v2M5 7h8M6 4V2.8M12 4V2.8"/></svg>
                      )}
                      {fact.icon === 'climate' && (
                        <svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="3.2"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M14.1 3.9l-1.4 1.4M5.3 12.7l-1.4 1.4"/></svg>
                      )}
                      {fact.icon === 'location' && (
                        <svg viewBox="0 0 18 18"><path d="M9 16s5-4.6 5-9A5 5 0 0 0 4 7c0 4.4 5 9 5 9Z"/><circle cx="9" cy="7" r="1.7"/></svg>
                      )}
                      {fact.text}
                    </span>
                  ))}
                </div>
              </div>
            </div>

            <div class="city-hero-envelope__message-frame">
              <span class="city-hero-envelope__city-name">{cityName}</span>
              <p class="city-hero-envelope__description">
                {messageLines.map((line) => <span>{line}</span>)}
              </p>
            </div>

            <img class="city-hero-envelope__city-stamp" src={stampSrc} alt="" />
            <img class="city-hero-envelope__air-mail" src="/assets/shared/hero/postmarks/air-mail-par-avion.webp" alt="" />
          </div>

          <style>
            .city-hero-envelope {
              --envelope-rule-start: 51.5%;
              position: relative;
              width: 100%;
              aspect-ratio: 2.15 / 1;
              isolation: isolate;
            }

            .city-hero-envelope__base {
              position: absolute;
              inset: 0;
              display: block;
              background: transparent var(--city-hero-envelope-source) center / 100% 100% no-repeat;
              pointer-events: none;
              clip-path: inset(7% 3.4% 6.8% 3.4%);
            }

            /* V1 media geometry, expressed once inside the shared envelope. */
            .city-hero-envelope__media-frame {
              --media-scale: .6;
              --media-size: 166.667%;
              position: absolute;
              top: 0;
              left: 0;
              z-index: 2;
              display: grid;
              grid-template-columns: minmax(0, 47%) minmax(0, 53%);
              width: var(--media-size);
              height: var(--media-size);
              box-sizing: border-box;
              padding: clamp(2rem, 3vw, 2.7rem);
              pointer-events: none;
              transform: scale(var(--media-scale)) rotate(-.15deg);
              transform-origin: top left;
            }

            .city-hero-envelope__media {
              grid-column: 1;
              display: flex;
              width: 103%;
              min-width: 0;
              flex-direction: column;
              padding: .7rem clamp(1.15rem, 2vw, 1.65rem) .45rem .55rem;
              transform: translate(3.15rem, 2.15rem);
              transform-origin: top left;
            }

            .city-hero-envelope__photo {
              position: relative;
              margin: 0;
              padding: .28rem;
              background: #fff;
              box-sizing: border-box;
              transform: rotate(.45deg);
            }

            .city-hero-envelope__photo img {
              display: block;
              width: 100%;
              height: 19.15rem;
              object-fit: cover;
              object-position: center;
              filter: saturate(.88) contrast(.97);
            }

            .city-hero-envelope__facts {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: .72rem 1.3rem;
              margin: 1.05rem 0 0 .2rem;
              color: rgba(31, 57, 45, .76);
              font-family: 'Segoe Print', 'Bradley Hand', cursive;
              font-size: 1.18rem;
              line-height: 1.15;
            }

            .city-hero-envelope__facts span {
              display: inline-flex;
              min-width: 0;
              align-items: center;
              gap: .35rem;
              white-space: nowrap;
            }

            .city-hero-envelope__facts svg {
              width: 1.36rem;
              height: 1.36rem;
              flex: 0 0 auto;
              fill: none;
              stroke: currentColor;
              stroke-width: 1.25;
              stroke-linecap: round;
              stroke-linejoin: round;
              opacity: .8;
            }

            /*
             * The original V1 postcard rendered its content on a 166.667% surface
             * scaled back to 60%. Reproducing that coordinate system here lets the
             * handwritten copy use the original line metrics without visual guesswork.
             */
            .city-hero-envelope__message-frame {
              --message-scale: .6;
              --message-size: 166.667%;
              --envelope-line-gap: 3.56rem;
              position: absolute;
              top: 0;
              left: 0;
              z-index: 2;
              width: var(--message-size);
              height: var(--message-size);
              pointer-events: none;
              transform: scale(var(--message-scale));
              transform-origin: top left;
            }

            .city-hero-envelope__city-name {
              position: absolute;
              top: calc(46.5% + .19rem);
              left: var(--envelope-rule-start);
              margin: 0;
              color: #315545;
              font-family: 'Segoe Print', 'Bradley Hand', cursive;
              font-size: 3.58rem;
              font-weight: 600;
              letter-spacing: -.035em;
              line-height: var(--envelope-line-gap);
              white-space: nowrap;
              transform: translateY(-.28rem) rotate(-.8deg);
            }

            .city-hero-envelope__description {
              position: absolute;
              top: calc(46.5% + 1.14rem + var(--envelope-line-gap));
              left: calc(var(--envelope-rule-start) + .55em);
              width: calc(96% - var(--envelope-rule-start) - .55em);
              margin: 0;
              color: #3f4943;
              font-family: 'Segoe Print', 'Bradley Hand', cursive;
              font-size: 1.11rem;
              font-weight: 500;
              letter-spacing: 0;
              line-height: var(--envelope-line-gap);
              transform: translateY(-.22rem) rotate(-.25deg);
            }

            .city-hero-envelope__description span { display: block; white-space: nowrap; }

            .city-hero-envelope__city-stamp {
              position: absolute;
              top: 7.51953%;
              left: 79.49219%;
              z-index: 3;
              display: block;
              width: 11.65365%;
              height: 26.46484%;
              object-fit: fill;
              pointer-events: none;
            }

            .city-hero-envelope__air-mail {
              position: absolute;
              top: calc(27.5% - 28px);
              right: 27%;
              z-index: 4;
              display: block;
              width: 19%;
              aspect-ratio: 360 / 168;
              object-fit: contain;
              opacity: .76;
              pointer-events: none;
              mix-blend-mode: multiply;
              filter: contrast(1.32) brightness(1.08) saturate(1.05);
              transform: rotate(-6deg);
              transform-origin: center;
            }

            @media (max-width: 980px) and (min-width: 761px) {
              .city-hero-envelope__media-frame { --media-scale: .8; --media-size: 125%; }
              .city-hero-envelope__media { width: 102%; transform: translate(2.25rem, 1.55rem); }
              .city-hero-envelope__photo img { height: 16.2rem; }
              .city-hero-envelope__facts { font-size: 1rem; }
              .city-hero-envelope__facts svg { width: 1.05rem; height: 1.05rem; }

              .city-hero-envelope__message-frame {
                --message-scale: .8;
                --message-size: 125%;
                --envelope-line-gap: 3.42rem;
              }
              .city-hero-envelope__city-name { font-size: 3.42rem; }
              .city-hero-envelope__description { top: calc(46.5% + .9rem + var(--envelope-line-gap)); font-size: 1.08rem; }
            }

            @media (max-width: 760px) {
              .city-hero-envelope__media-frame {
                --media-scale: .6;
                --media-size: 166.667%;
                padding: 1.25rem;
              }
              .city-hero-envelope__media {
                width: 101%;
                padding: .35rem .8rem .3rem .2rem;
                transform: translate(1.4rem, 1.15rem);
              }
              .city-hero-envelope__photo { padding: .2rem; }
              .city-hero-envelope__photo img { height: 13rem; }
              .city-hero-envelope__facts { gap: .48rem .72rem; margin-top: .65rem; font-size: .96rem; }
              .city-hero-envelope__facts svg { width: 1.05rem; height: 1.05rem; }

              .city-hero-envelope__message-frame {
                --message-scale: .6;
                --message-size: 166.667%;
                --envelope-line-gap: 2.84rem;
              }
              .city-hero-envelope__city-name { top: calc(46.5% + .1rem); font-size: 2.35rem; line-height: var(--envelope-line-gap); }
              .city-hero-envelope__description { top: calc(46.5% + .62rem + var(--envelope-line-gap)); font-size: .88rem; line-height: var(--envelope-line-gap); }
              .city-hero-envelope__air-mail { top: calc(26% - 28px); right: 23%; width: 22%; }
            }
          </style>
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/models/types.ts')
          s = p.read_text()
          s = s.replace("export interface CityHeroMedia { photos: MediaRecord[]; }\n", "")
          s = s.replace("export interface CityHero { eyebrow: string; title: string; subtitle: string; facts: HeroFact[]; media: CityHeroMedia; }", "export interface CityHero { eyebrow: string; title: string; subtitle: string; facts: HeroFact[]; }")
          p.write_text(s)

          p = Path('scripts/lib/city-pipeline.mjs')
          s = p.read_text().replace("hero: { eyebrow: country, title: name, subtitle: '', facts: [], media: { photos: [] } },", "hero: { eyebrow: country, title: name, subtitle: '', facts: [] },")
          p.write_text(s)

          p = Path('scripts/generate-city.mjs')
          s = p.read_text()
          s = s.replace("if (cityInput?.hero?.media) {\n  delete cityInput.hero.media.stamps;\n  delete cityInput.hero.media.drawings;\n}\n", "if (cityInput?.hero?.media) delete cityInput.hero.media;\n")
          s = s.replace("draft.cityData.hero.media ??= { photos: [] };\ndelete draft.cityData.hero.media.stamps;\ndelete draft.cityData.hero.media.drawings;\n", "if (draft.cityData.hero?.media) delete draft.cityData.hero.media;\n")
          p.write_text(s)

          p = Path('scripts/city-media-tests.mjs')
          p.write_text("""import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport { emptyDraft } from './lib/city-pipeline.mjs';\n\nconst fresh = emptyDraft('testland', 'test-city', 'compact');\nassert.equal('media' in fresh.cityData, false, 'new City drafts must not own a duplicate media manifest');\nassert.equal('media' in fresh.cityData.hero, false, 'new City Hero data must resolve visual assets from the asset convention');\nconst draft = JSON.parse(fs.readFileSync('pipeline/cities/laos/don-det.json', 'utf8'));\nassert.equal('media' in draft.cityData, false, 'Don Det must not keep a duplicate City media manifest');\nassert.equal('media' in draft.cityData.hero, false, 'Don Det Hero photo/stamp/drawing come from the global asset resolver');\nassert.equal(draft.cityData.manualLocks['hero.media.photos'], undefined, 'obsolete Hero photo media lock is removed');\nfor (const entity of [...draft.places, ...draft.things]) assert.equal(entity.media?.hero, undefined, 'Place/ThingToDo media must not own Hero media');\nconsole.log('City media ownership tests passed.');\n""")

          p = Path('scripts/validate-generated-data.mjs')
          s = p.read_text()
          s = s.replace("  const heroMedia = draft.cityData.hero?.media ?? {};\n  if ('stamps' in heroMedia || 'drawings' in heroMedia) fail.push(`City Hero stamp/drawing media must come from the asset resolver: ${draft.country}/${draft.city}`);\n", "  if (draft.cityData.hero?.media) fail.push(`City Hero visual media must come from the asset resolver: ${draft.country}/${draft.city}`);\n")
          p.write_text(s)
          PY

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'pipeline/cities/laos/don-det.json';
          const draft = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete draft.cityData.hero.media;
          delete draft.cityData.manualLocks['hero.media.photos'];
          fs.writeFileSync(path, `${JSON.stringify(draft, null, 2)}\n`);
          NODE

          node scripts/generate-city.mjs laos don-det --from-city

      - name: Validate
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:city-media
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-universal-hero-photo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add universal city Hero photo and facts'
          git push origin HEAD:master
