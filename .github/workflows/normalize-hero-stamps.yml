name: Normalize Hero stamps

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/normalize-hero-stamps.yml'

permissions:
  contents: write

jobs:
  normalize-stamps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trim transparent stamp canvases
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const astroPackagePath = require.resolve('astro/package.json');
          const astroRequire = createRequire(astroPackagePath);
          const sharpModule = astroRequire('sharp');
          const sharp = sharpModule.default ?? sharpModule;

          const citiesRoot = path.join(process.cwd(), 'public', 'assets', 'cities');
          const cityEntries = await fs.readdir(citiesRoot, { withFileTypes: true });

          for (const entry of cityEntries) {
            if (!entry.isDirectory()) continue;
            const file = path.join(citiesRoot, entry.name, 'hero', 'stamps', `${entry.name}-hero-stamp.webp`);
            try {
              const before = await sharp(file).metadata();
              const temp = `${file}.tmp.webp`;
              const { info } = await sharp(file)
                .ensureAlpha()
                .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 8 })
                .webp({ lossless: true, alphaQuality: 100 })
                .toFile(temp);
              await fs.rename(temp, file);
              console.log(`${entry.name}: ${before.width}x${before.height} -> ${info.width}x${info.height}`);
            } catch (error) {
              if (error?.code === 'ENOENT') continue;
              throw error;
            }
          }
          NODE

      - name: Commit normalized stamps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/cities/*/hero/stamps/*.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Trim transparent padding from city Hero stamps'
          git push origin HEAD:master
