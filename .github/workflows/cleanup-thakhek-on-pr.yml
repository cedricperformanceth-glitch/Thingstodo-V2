name: Definitive Thakhek cleanup via PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'chore/thakhek-cleanup-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply definitive cleanup
        run: |
          node scripts/cleanup-thakhek-dead-content-once.mjs
          git rm -f src/content/thing-status-overrides.json
      - name: Regenerate Thakhek
        run: npm run generate-city -- laos thakhek --skip-photo-discovery
      - name: Verify cleanup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const removedId = 'thing-tham-nang-aen-cave';
          const shortIds = ['thing-tham-chang-elephant-cave','thing-tha-falang','thing-pha-inh-cave','thing-cool-springs-loop','thing-sandstone-buddhas'];
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const file of ['pipeline/sources/laos/thakhek.json','pipeline/cities/laos/thakhek.json']) {
            if ((read(file).things ?? []).some((thing) => thing.id === removedId)) throw new Error(`${file}: Nang Aen still exists`);
          }
          const secondary = read('src/content/field-card-secondary-story-copy.json');
          for (const id of shortIds) if (Object.prototype.hasOwnProperty.call(secondary, id)) throw new Error(`${id}: dead secondary story remains`);
          for (const file of ['src/content/field-card-compact-copy.json','src/content/field-card-compact-additions.json','src/content/field-card-editorial-overrides.json','src/content/field-card-editorial-thakhek.json','src/content/field-card-editorial-thakhek-additions.json','src/content/field-card-editorial-hin-nam-no.json']) {
            const data = read(file);
            for (const id of shortIds) {
              if (data[id] && Object.prototype.hasOwnProperty.call(data[id], 'secondaryStory')) throw new Error(`${file}/${id}: dead secondaryStory remains`);
              if (Array.isArray(data[id]?.media) && data[id].media.length > 2) throw new Error(`${file}/${id}: more than 2 short-card media remain`);
            }
          }
          for (const file of ['src/content/field-card-media-copy.json','src/content/field-card-media-additions.json']) {
            const data = read(file);
            for (const id of shortIds) if (Array.isArray(data[id]) && data[id].length > 2) throw new Error(`${file}/${id}: more than 2 short-card media remain`);
          }
          for (const file of ['pipeline/sources/laos/thakhek.json','pipeline/cities/laos/thakhek.json','src/content/generated/laos/thakhek.ts']) {
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(removedId) || /Nang Aen/i.test(text)) throw new Error(`${file}: retired Nang Aen text remains`);
          }
          console.log('Definitive cleanup verified.');
          NODE
      - name: Validate generator and build
        run: |
          npm run test:generation-integration
          npm run build
      - name: Commit cleaned master and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/cleanup-thakhek-dead-content-once.mjs
          rm -f .github/workflows/cleanup-thakhek-dead-content-once.yml
          rm -f .github/workflows/cleanup-thakhek-on-pr.yml
          rm -f .github/thakhek-cleanup-trigger.txt
          git add -A
          git commit -m "refactor: permanently remove Nang Aen and short-card dead content"
          git push origin HEAD:master
