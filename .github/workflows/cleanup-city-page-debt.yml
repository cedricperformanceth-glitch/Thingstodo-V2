name: Clean city page debt

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-city-page-debt.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply no-visual-change cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) One shared SPA category contract for runtime + generation pipeline.
          contract = {
              'village': ['things-to-do', 'accommodation', 'restaurants', 'cafes', 'practical-services'],
              'city': ['things-to-do', 'accommodation', 'restaurants', 'cafes', 'scooter-rental', 'gyms', 'markets', 'practical-services'],
          }
          contract_path = root / 'src/core/contracts/spa-categories.json'
          contract_path.parent.mkdir(parents=True, exist_ok=True)
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')

          spa_engine = root / 'src/engines/spa/spa-engine.ts'
          text = spa_engine.read_text()
          old_import = "import type { CategorySlug, City, SettlementType } from '../../core/models/types';\n"
          assert old_import in text
          text = text.replace(old_import, old_import + "import spaCategoryOrder from '../../core/contracts/spa-categories.json';\n", 1)
          old_order = """const categoryOrder: Record<SettlementType, readonly CategorySlug[]> = {\n  village: ['things-to-do', 'accommodation', 'restaurants', 'cafes', 'practical-services'],\n  city: ['things-to-do', 'accommodation', 'restaurants', 'cafes', 'scooter-rental', 'gyms', 'markets', 'practical-services'],\n};"""
          assert old_order in text
          text = text.replace(old_order, "const categoryOrder = spaCategoryOrder as Record<SettlementType, readonly CategorySlug[]>;", 1)
          spa_engine.write_text(text)

          pipeline = root / 'scripts/lib/city-pipeline.mjs'
          text = pipeline.read_text()
          assert "import crypto from 'node:crypto';\n" in text
          text = text.replace("import crypto from 'node:crypto';\n", "import crypto from 'node:crypto';\nimport { createRequire } from 'node:module';\n\nconst require = createRequire(import.meta.url);\nconst spaCategoryOrder = require('../../src/core/contracts/spa-categories.json');\n", 1)
          old_contract = """export const SETTLEMENT_CATEGORIES = Object.freeze({\n  village: Object.freeze(['things-to-do', 'accommodation', 'restaurants', 'cafes', 'practical-services']),\n  city: Object.freeze(['things-to-do', 'accommodation', 'restaurants', 'cafes', 'scooter-rental', 'gyms', 'markets', 'practical-services']),\n});"""
          assert old_contract in text
          text = text.replace(old_contract, """export const SETTLEMENT_CATEGORIES = Object.freeze({\n  village: Object.freeze([...spaCategoryOrder.village]),\n  city: Object.freeze([...spaCategoryOrder.city]),\n});""", 1)
          pipeline.write_text(text)

          # 2) One shared visual definition for PlaceCard + ThingToDoCard.
          shared_css = """.atlas-entry-card {\n  position: relative;\n  min-width: 0;\n  overflow: hidden;\n  border: 1px solid rgba(75,81,70,.22);\n  border-radius: 0;\n  background: #eee8dc;\n  box-shadow: 5px 7px 0 rgba(49,85,69,.07);\n}\n.atlas-entry-card .card-media {\n  position: relative;\n  height: 205px;\n  overflow: hidden;\n  background: #e8e3d6;\n}\n.atlas-entry-card .card-media::after {\n  content: '';\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background: linear-gradient(180deg,transparent 48%,rgba(24,31,26,.3));\n}\n.atlas-entry-card .card-media.empty { min-height: 0; }\n.atlas-entry-card img {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  filter: saturate(.72) contrast(.96);\n}\n.atlas-entry-card .card-preview {\n  display: flex;\n  min-height: 190px;\n  flex-direction: column;\n  padding: 23px 22px 20px;\n}\n.atlas-entry-card .eyebrow,\n.atlas-entry-card .card-type {\n  margin: 0 0 9px;\n  color: #b76645;\n  font: 700 .56rem/1.2 'DM Sans',var(--sans);\n  letter-spacing: .13em;\n  text-transform: uppercase;\n}\n.atlas-entry-card .eyebrow { margin-bottom: 6px; }\n.atlas-entry-card h3 {\n  margin: 0 0 10px;\n  color: #315545;\n  font: 500 clamp(1.55rem,2.1vw,2rem)/1.04 Fraunces,var(--serif);\n  letter-spacing: -.035em;\n}\n.atlas-entry-card .card-description {\n  display: -webkit-box;\n  margin: 0;\n  overflow: hidden;\n  color: #68685f;\n  font: 400 .77rem/1.58 'DM Sans',var(--sans);\n  -webkit-box-orient: vertical;\n  -webkit-line-clamp: 2;\n}\n.atlas-entry-card .destination {\n  margin: -3px 0 9px;\n  color: rgba(49,85,69,.62);\n  font: 600 .58rem/1.3 'DM Sans',var(--sans);\n  letter-spacing: .08em;\n  text-transform: uppercase;\n}\n"""
          (root / 'src/components/cards/entry-card.css').write_text(shared_css)

          for rel in ['src/components/cards/PlaceCard.astro', 'src/components/cards/ThingToDoCard.astro']:
              path = root / rel
              text = path.read_text()
              marker = "import CardActions from './CardActions.astro';\n"
              assert marker in text
              if "import './entry-card.css';" not in text:
                  text = text.replace(marker, marker + "import './entry-card.css';\n", 1)
              updated, n = re.subn(r'\n<style>\n.*?</style>\s*$', '\n', text, count=1, flags=re.S)
              assert n == 1, rel
              path.write_text(updated)

          # 3) Remove stale card/button overrides from CitySpa, while preserving their visible hover/rotation behavior in SpaPanel.
          city_spa = root / 'src/components/spa/CitySpa.astro'
          text = city_spa.read_text()
          legacy = re.compile(
              r"\n  \.travel-desk :global\(\.spa-card-grid>\.card\)\{.*?\}"
              r"\.travel-desk :global\(\.spa-card-grid>\.card:nth-child\(5n \+ 2\)\)\{.*?\}"
              r"\.travel-desk :global\(\.spa-card-grid>\.card:nth-child\(5n \+ 4\)\)\{.*?\}"
              r"\.travel-desk :global\(\.spa-card-grid>\.card:hover\)\{.*?\}\n"
              r"  \.travel-desk :global\(\.spa-card-grid>\.card h3\)\{.*?\}"
              r"\.travel-desk :global\(\.spa-card-grid>\.card p\)\{.*?\}"
              r"\.travel-desk :global\(\.spa-card-grid>\.card \.button\)\{.*?\}\n",
              re.S,
          )
          text, n = legacy.subn('\n', text, count=1)
          assert n == 1, 'legacy CitySpa card override not found exactly once'
          city_spa.write_text(text)

          spa_panel = root / 'src/components/spa/SpaPanel.astro'
          text = spa_panel.read_text()
          shell = """    background:#eee8dc !important;\n    box-shadow:4px 5px 0 rgba(49,85,69,.075);\n  }"""
          assert shell in text
          preserved = """    background:#eee8dc !important;\n    box-shadow:4px 5px 0 rgba(49,85,69,.075);\n    transition:transform 180ms ease,box-shadow 180ms ease;\n  }\n  .spa-panel__content :global(.spa-card-grid > .atlas-entry-card:nth-child(5n + 2)){transform:rotate(-.12deg)}\n  .spa-panel__content :global(.spa-card-grid > .atlas-entry-card:nth-child(5n + 4)){transform:rotate(.12deg)}\n  .spa-panel__content :global(.spa-card-grid > .atlas-entry-card:hover){transform:translateY(-3px) rotate(0);box-shadow:6px 8px 0 rgba(49,85,69,.09)}"""
          text = text.replace(shell, preserved, 1)
          spa_panel.write_text(text)
          PY

      - name: Validate everything
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:manual-locks
          npm run test:favorites
          npm run test:favorites-scalability
          npm run test:city-media
          npm run test:spa-contract
          git diff --check

      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/cleanup-city-page-debt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean universal city page implementation'
          git push origin master
