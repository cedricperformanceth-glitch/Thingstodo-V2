            'thing-uxo-lao-visitor-centre': {
              queries: ['UXO Luang Prabang Center', 'UXO Lao Visitor Centre Luang Prabang'],
              accept: (s) => /uxo/i.test(s) && /(luang prabang|luang phabang)/i.test(s),
              alt: 'UXO Lao Visitor Centre in Luang Prabang'
            },
            'thing-traditional-arts-ethnology-centre': {
              queries: ['Traditional Arts and Ethnology Centre Luang Prabang'],
              accept: (s) => /(traditional arts and ethnology|ethnology centre|ethnology center)/i.test(s) && /(luang prabang|museum)/i.test(s),
              alt: 'Traditional Arts and Ethnology Centre in Luang Prabang'
            },
            'thing-ock-pop-tok-living-crafts-centre': {
              queries: ['Ock Pop Tok Luang Prabang', 'Living Crafts Centre Luang Prabang Ock Pop Tok'],
              accept: (s) => /(ock pop tok|living crafts cent(re|er))/i.test(s) && /(luang prabang|textile|weav|craft)/i.test(s),
              alt: 'Ock Pop Tok Living Crafts Centre and textile work in Luang Prabang'
            },
            'thing-ban-xang-khong-weaving-village': {
              queries: ['Ban Xang Khong Luang Prabang', 'Xang Khong weaving Laos'],
              accept: (s) => /(ban )?xang[ _-]?khong/i.test(s) && /(silk|weav|paper|saa|village|luang prabang)/i.test(s),
              alt: 'Silk weaving and craft work at Ban Xang Khong near Luang Prabang'
            }
          };

          const stripHtml = (value = '') => String(value)
            .replace(/<[^>]*>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#0?39;/g, "'")
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const cleanAuthor = (value = '') => {
            const author = stripHtml(value);
            const supanut = author.match(/Supanut Arunoprayote/i);
            if (supanut) return 'Supanut Arunoprayote';
            const takenBy = author.match(/(?:taken|photo) by\s+([^.;|]+)/i);
            if (takenBy?.[1]) return takenBy[1].trim();
            if (author.length > 180) return author.split(/[.;|]/)[0].trim();
            return author;
          };

          const normalizeLicense = (value = '') => {
            const license = stripHtml(value).toLowerCase();
            if (license.includes('cc by-sa') || license.includes('cc-by-sa')) return 'cc-by-sa';
            if (license.includes('cc by') || license.includes('cc-by')) return 'cc-by';
            if (license.includes('cc0')) return 'cc0';
            if (license.includes('public domain') || license === 'pd') return 'public-domain';
            return null;
          };

          const searchCommons = async (query) => {
            const params = new URLSearchParams({
              action: 'query',
              format: 'json',
              formatversion: '2',
              generator: 'search',
              gsrsearch: query,
              gsrnamespace: '6',
              gsrlimit: '24',
              prop: 'info|imageinfo',
              inprop: 'url',
              iiprop: 'url|size|extmetadata',
              iiurlwidth: '1920'
            });
            const response = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`, {
              headers: { 'User-Agent': 'ThingsToDoAtlas/2.0 Luang Prabang activity media research' }
            });
            if (!response.ok) throw new Error(`Commons HTTP ${response.status} for ${query}`);
            const payload = await response.json();
            return payload.query?.pages ?? [];
          };

          const makeAsset = (page, alt) => {
            const info = page.imageinfo?.[0];
            if (!info) return null;
            const license = normalizeLicense(info.extmetadata?.LicenseShortName?.value);
            if (!license) return null;
            const width = Number(info.width ?? info.thumbwidth ?? 0);
            const height = Number(info.height ?? info.thumbheight ?? 0);
            if (Math.max(width, height) < 640 || Math.min(width, height) < 400) return null;
            const author = cleanAuthor(info.extmetadata?.Artist?.value);
            if (!author) return null;
            const description = stripHtml(info.extmetadata?.ImageDescription?.value);
            const objectName = stripHtml(info.extmetadata?.ObjectName?.value);
            return {
              id: `commons-${page.pageid}`,
              src: info.thumburl ?? info.url,
              alt,
              sourceType: 'wikimedia',
              sourceUrl: page.canonicalurl,
              sourceName: 'Wikimedia Commons',
              author,
              license,
              manual: false,
              locked: false,
              _haystack: `${page.title ?? ''} ${description} ${objectName}`,
              _width: width,
              _height: height
            };
          };

          const report = {};
          for (const [thingId, config] of Object.entries(mediaConfigs)) {
            const thing = draft.things.find((entry) => entry.id === thingId);
            if (!thing) throw new Error(`Missing Luang Prabang activity: ${thingId}`);
            if (thing.media?.card?.image?.locked) {
              report[thingId] = { keptLocked: true, count: thing.media?.fieldCard?.gallery?.length ?? 1 };
              continue;
            }

            const pages = new Map();
            for (const query of config.queries) {
              for (const page of await searchCommons(query)) pages.set(page.pageid, page);
            }
            const candidates = [...pages.values()]
              .map((page) => makeAsset(page, config.alt))
              .filter(Boolean)
              .filter((asset) => config.accept(asset._haystack))
              .sort((a, b) => {
                const aLandscape = a._width >= a._height ? 1 : 0;
                const bLandscape = b._width >= b._height ? 1 : 0;
                return bLandscape - aLandscape || (b._width * b._height) - (a._width * a._height);
              });

            const unique = [];
            const seen = new Set();
            for (const candidate of candidates) {
              if (seen.has(candidate.sourceUrl)) continue;
              seen.add(candidate.sourceUrl);
              const { _haystack, _width, _height, ...clean } = candidate;
              unique.push(clean);
              if (unique.length === 3) break;
            }

            thing.media ??= {};
            thing.media.card ??= {};
            thing.media.fieldCard ??= { gallery: [] };
            if (unique.length) {
              thing.media.card.image = unique[0];
              thing.media.fieldCard.gallery = unique;
              thing.spaCard.photoStatus = 'verified';
              thing.spaCard.photoRequiresManualFill = false;
            } else {
              delete thing.media.card.image;
              thing.media.fieldCard.gallery = [];
              thing.spaCard.photoStatus = 'missing';
              thing.spaCard.photoRequiresManualFill = true;
            }
            report[thingId] = { count: unique.length, sources: unique.map((asset) => asset.sourceUrl) };
          }

          for (const [thingId, editorial] of Object.entries(editorials)) {
            if (!Array.isArray(editorial.faq) || editorial.faq.length !== 5) throw new Error(`${thingId}: editorial must contain exactly 5 FAQ items`);
            if (!Array.isArray(editorial.sources) || !editorial.sources.length) throw new Error(`${thingId}: editorial requires sources`);
            const thing = draft.things.find((entry) => entry.id === thingId);
            if (!thing) throw new Error(`${thingId}: missing thing`);
            const media = thing.media?.fieldCard?.gallery ?? [];
            const entry = { ...editorial, ...(media.length ? { media } : {}) };
            if (media[0]) entry.seo = { ...entry.seo, image: media[0].src };
            fs.writeFileSync(path.join(editorialDir, `${thingId}.json`), `${JSON.stringify({ [thingId]: entry }, null, 2)}\n`);
          }

          fs.writeFileSync(sourceFile, `${JSON.stringify(draft, null, 2)}\n`);
          fs.writeFileSync(generatedFile, tsModule(draft));
          fs.writeFileSync('luang-prabang-activity-completion-report.json', `${JSON.stringify(report, null, 2)}\n`);

          const dataFile = 'src/content/field-card-editorial-data.ts';
          let dataTs = fs.readFileSync(dataFile, 'utf8');
          const ids = Object.keys(editorials);
          const importLines = ids.map((id, index) => `import luangPrabangEditorial${index} from './field-card-editorial-luang-prabang/${id}.json';`).join('\n');
          if (!dataTs.includes("field-card-editorial-luang-prabang/thing-luang-prabang-heritage-walk.json")) {
            const anchor = "import champasakRiversideEditorial from './field-card-editorial-pakse/thing-champasak-riverside.json';";
            if (!dataTs.includes(anchor)) throw new Error('Editorial data import anchor not found');
            dataTs = dataTs.replace(anchor, `${anchor}\n${importLines}`);

            const objectAnchor = `const pakseEditorial = {\n  ...vatPhouEditorial,\n  ...tadFaneEditorial,\n  ...tadYuangEditorial,\n  ...bolavenCoffeeRouteEditorial,\n  ...watPhouSalaoEditorial,\n  ...watLuangEditorial,\n  ...daoHeuangMarketEditorial,\n  ...tadChampeeEditorial,\n  ...champasakRiversideEditorial,\n} as unknown as Record<string, FieldCardEditorialEntry>;`;
            if (!dataTs.includes(objectAnchor)) throw new Error('Pakse editorial object anchor not found');
            const luangObject = `\n\nconst luangPrabangEditorial = {\n${ids.map((id, index) => `  ...luangPrabangEditorial${index},`).join('\n')}\n} as unknown as Record<string, FieldCardEditorialEntry>;`;
            dataTs = dataTs.replace(objectAnchor, `${objectAnchor}${luangObject}`);
            dataTs = dataTs.replace('  ...pakseEditorial,\n};', '  ...pakseEditorial,\n  ...luangPrabangEditorial,\n};');
          }
          fs.writeFileSync(dataFile, dataTs);

          console.log('Luang Prabang media report:');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Validate completed Luang Prabang content
        shell: bash
        run: |
          npm run validate-content
          npm run test:spa-card-media
          npm run test:photo-discovery
          npm run test:field-card-hero
          npm run test:field-card-quick-read
          npm run test:field-card-story-block
          npm run test:field-card-secondary-story
          npm run test:field-card-practical
          npm run test:field-card-faq
          npm run check
          npm run build

      - name: Commit verified Luang Prabang completion
        shell: bash
        run: |
          rm .github/workflows/luang-prabang-activities-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cities/laos/luang-prabang.json src/content/generated/laos/luang-prabang.ts src/content/field-card-editorial-luang-prabang src/content/field-card-editorial-data.ts luang-prabang-activity-completion-report.json .github/workflows/luang-prabang-activities-once.yml
          git commit -m "Complete Luang Prabang activity media and Field Cards"
          git push origin HEAD:master
