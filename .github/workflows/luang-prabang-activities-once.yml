name: Complete Luang Prabang activities once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/luang-prabang-activities-once.yml'

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Complete Luang Prabang activity media and Field Cards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { tsModule } from './scripts/lib/city-pipeline.mjs';

          const sourceFile = 'pipeline/cities/laos/luang-prabang.json';
          const generatedFile = 'src/content/generated/laos/luang-prabang.ts';
          const editorialDir = 'src/content/field-card-editorial-luang-prabang';
          const draft = JSON.parse(fs.readFileSync(sourceFile, 'utf8'));
          fs.mkdirSync(editorialDir, { recursive: true });

          const officialTourism = 'https://tourismluangprabang.gov.la/';
          const unesco = 'https://whc.unesco.org/en/list/479/';

          const editorials = {
            'thing-luang-prabang-heritage-walk': {
              hero: {
                eyebrow: 'HERITAGE WALK · PENINSULA',
                aliases: ['Luang Prabang old town walk', 'UNESCO peninsula walk', 'Mekong–Nam Khan heritage walk'],
