                  { label: 'THE PACE', title: 'Walk early, then let the route loosen', body: 'An early start gives you cooler air and calmer streets, but there is no single correct circuit. Use Sisavangvong Road as a spine, then step into side lanes and river edges. Respect monastery space, avoid blocking residents, and remember that the old town is still lived in rather than preserved as an open-air museum.' }
