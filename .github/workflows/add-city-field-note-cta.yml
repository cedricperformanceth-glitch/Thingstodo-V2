name: Add universal City Field Note CTA

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/add-city-field-note-cta.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Add universal city field-note route and Explore Board CTA
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = Path('src/core/routing/paths.ts')
          text = paths.read_text()
          needle = "export const cityPath = (city: City) => `/${city.country}/${city.slug}`;\n"
          replacement = needle + "export const cityFieldNotePath = (city: City) => `${cityPath(city)}/field-note`;\n"
          if 'cityFieldNotePath' not in text:
              if needle not in text:
                  raise SystemExit('cityPath insertion point not found')
              text = text.replace(needle, replacement)
              paths.write_text(text)

          board = Path('src/components/explore-board/ExploreBoard.astro')
          text = board.read_text()
          text = text.replace(
              "import { thingPath } from '../../core/routing/paths';",
              "import { cityFieldNotePath, thingPath } from '../../core/routing/paths';"
          )
          text = text.replace(
              "const sectionId = `explore-board-${city.country}-${city.slug}`;",
              "const sectionId = `explore-board-${city.country}-${city.slug}`;\nconst cityNoteHref = cityFieldNotePath(city);"
          )
          marker = '    <div class="explore-board">\n'
          cta = '''    <div class="explore-board">\n      <a class="explore-board__city-note" href={cityNoteHref} aria-label={`Read the ${city.name} City Field Note`}>\n        <span class="explore-board__city-note-tape" aria-hidden="true"></span>\n        <span>Read the City Field Note</span>\n      </a>\n'''
          if 'explore-board__city-note"' not in text:
              if marker not in text:
                  raise SystemExit('Explore Board insertion point not found')
              text = text.replace(marker, cta, 1)

          text = text.replace(
              'width: min(1320px, calc(100% - .5rem));',
              'width: min(1400px, calc(100% - .25rem));',
              1
          )
          text = text.replace(
              'width: min(100% - 1rem, 1320px);',
              'width: min(100% - 1rem, 1400px);'
          )
          text = text.replace(
              'width: min(100% - .5rem, 1320px);',
              'width: min(100% - .5rem, 1400px);'
          )

          css_marker = '''  .explore-board::after {\n'''
          css = '''  .explore-board__city-note {\n    position: absolute;\n    top: clamp(2rem, 3vw, 2.7rem);\n    left: clamp(1.15rem, 2.2vw, 2rem);\n    z-index: 4;\n    display: inline-flex;\n    width: clamp(6.7rem, 9vw, 7.7rem);\n    min-height: 3.15rem;\n    align-items: center;\n    justify-content: center;\n    box-sizing: border-box;\n    padding: .62rem .72rem .5rem;\n    border: 1px solid rgba(90, 72, 42, .28);\n    background: #d9c99a;\n    color: #315545;\n    box-shadow: 0 5px 10px rgba(0,0,0,.28), inset 0 0 12px rgba(255,255,255,.12);\n    font-family: 'Segoe Print', 'Bradley Hand', cursive;\n    font-size: clamp(.56rem, .72vw, .68rem);\n    font-weight: 600;\n    line-height: 1.25;\n    text-align: center;\n    text-decoration: none;\n    transform: rotate(-3.5deg);\n    transition: transform 180ms ease, box-shadow 180ms ease;\n  }\n\n  .explore-board__city-note-tape {\n    position: absolute;\n    top: -.38rem;\n    left: 50%;\n    width: 2.65rem;\n    height: .62rem;\n    background: rgba(220, 207, 171, .7);\n    box-shadow: 0 1px 2px rgba(0,0,0,.16);\n    transform: translateX(-50%) rotate(2deg);\n    pointer-events: none;\n  }\n\n  .explore-board__city-note:hover,\n  .explore-board__city-note:focus-visible {\n    outline: none;\n    box-shadow: 0 8px 14px rgba(0,0,0,.34), inset 0 0 12px rgba(255,255,255,.15);\n    transform: translateY(-2px) rotate(-2.6deg);\n  }\n\n'''
          if '.explore-board__city-note {' not in text:
              if css_marker not in text:
                  raise SystemExit('Explore Board CSS insertion point not found')
              text = text.replace(css_marker, css + css_marker, 1)
          board.write_text(text)

          route = Path('src/pages/[country]/[city]/field-note.astro')
          route.write_text('''---\nimport BaseLayout from '../../../components/layout/BaseLayout.astro';\nimport { getCities, getCity } from '../../../engines/city/city-engine';\nimport { getCountry } from '../../../engines/country/country-engine';\nimport { cityFieldNotePath, cityPath } from '../../../core/routing/paths';\n\nexport function getStaticPaths() {\n  return getCities().map((city) => ({ params: { country: city.country, city: city.slug } }));\n}\n\nconst city = getCity(Astro.params.country ?? '', Astro.params.city ?? '');\nconst country = getCountry(Astro.params.country ?? '');\nif (!city || !country) return Astro.redirect('/');\n\nconst seo = {\n  title: `${city.name} City Field Note | Things To Do Atlas`,\n  description: city.description,\n  canonicalPath: cityFieldNotePath(city),\n  indexable: false,\n};\n---\n\n<BaseLayout\n  {seo}\n  breadcrumbs={[\n    { name: 'Home', path: '/' },\n    { name: country.name, path: `/${country.slug}` },\n    { name: city.name, path: cityPath(city) },\n    { name: 'City Field Note', path: cityFieldNotePath(city) },\n  ]}\n>\n  <main class="city-field-note">\n    <a class="city-field-note__back" href={cityPath(city)}>← Back to {city.name}</a>\n    <article class="city-field-note__paper">\n      <p class="city-field-note__eyebrow">CITY FIELD NOTE · {country.name.toUpperCase()}</p>\n      <h1>{city.name}</h1>\n      <p>{city.description}</p>\n    </article>\n  </main>\n</BaseLayout>\n\n<style>\n  .city-field-note {\n    width: min(52rem, calc(100% - 2rem));\n    margin: 0 auto;\n    padding: clamp(6rem, 10vw, 8rem) 0 5rem;\n  }\n\n  .city-field-note__back {\n    display: inline-block;\n    margin-bottom: 1rem;\n    color: #315545;\n    font-family: 'Segoe Print', 'Bradley Hand', cursive;\n    font-size: .78rem;\n    text-decoration: none;\n  }\n\n  .city-field-note__paper {\n    padding: clamp(2rem, 5vw, 4rem);\n    border: 1px solid rgba(31,57,45,.16);\n    background: #f7f2e6;\n    box-shadow: 0 10px 28px rgba(31,41,36,.08);\n  }\n\n  .city-field-note__eyebrow {\n    margin: 0 0 .75rem;\n    color: rgba(31,57,45,.58);\n    font-size: .68rem;\n    font-weight: 700;\n    letter-spacing: .16em;\n  }\n\n  .city-field-note h1 {\n    margin: 0 0 1rem;\n    color: #1f392d;\n    font-family: Georgia, 'Times New Roman', serif;\n    font-size: clamp(2.5rem, 6vw, 4.8rem);\n    font-weight: 400;\n    letter-spacing: -.05em;\n    line-height: .98;\n  }\n\n  .city-field-note__paper > p:last-child {\n    max-width: 42rem;\n    margin: 0;\n    color: rgba(31,41,36,.78);\n    font-family: Georgia, 'Times New Roman', serif;\n    font-size: 1.05rem;\n    line-height: 1.65;\n  }\n</style>\n''')
          PY

      - name: Validate
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          git diff --check

      - name: Commit implementation and remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/add-city-field-note-cta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add universal City Field Note CTA'
          git push origin HEAD:master
