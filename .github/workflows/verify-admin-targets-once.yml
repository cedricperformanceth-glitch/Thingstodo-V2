name: Verify admin target cleanup

on:
  push:
    branches: [cleanup-admin-targets]
    paths:
      - '.github/workflows/verify-admin-targets-once.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-admin-targets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fix Hero editorial length
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'src/content/field-card-editorial.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data['thing-4000-islands-kayaking'].hero.rhythmNote = 'Do not improvise a solo river route. Mekong conditions change with water level, so follow the guide and keep the life jacket on.';
          fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          rm -f cleanup-admin-targets.log
      - name: Verify complete repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:city-template 2>&1 | tee /tmp/verify-admin-targets.log
      - name: Commit result
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/verify-admin-targets-once.yml
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then cp /tmp/verify-admin-targets.log cleanup-admin-targets.log; else rm -f cleanup-admin-targets.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$([ '${{ steps.verify.outcome }}' = 'success' ] && echo 'Verify admin-controlled category counts' || echo 'Record admin target verification failure')"
          git push origin HEAD:cleanup-admin-targets
          if [ "${{ steps.verify.outcome }}" = "failure" ]; then exit 1; fi
