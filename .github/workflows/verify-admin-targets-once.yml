name: Verify admin target cleanup

on:
  push:
    branches: [cleanup-admin-targets]
    paths:
      - '.github/workflows/verify-admin-targets-once.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-admin-targets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify complete repository
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:city-template 2>&1 | tee /tmp/verify-admin-targets.log
      - name: Commit success marker cleanup
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f cleanup-admin-targets.log
          rm -f .github/workflows/verify-admin-targets-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify admin-controlled category counts"
          git push origin HEAD:cleanup-admin-targets
      - name: Record failure
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/verify-admin-targets.log cleanup-admin-targets.log
          rm -f .github/workflows/verify-admin-targets-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record admin target verification failure"
          git push origin HEAD:cleanup-admin-targets
          exit 1
