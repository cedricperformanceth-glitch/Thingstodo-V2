name: Normalize Hero stamps to V1 slot

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/measure-hero-stamp.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild stamps on the exact V1 detected slot canvas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const astroPackagePath = require.resolve('astro/package.json');
          const astroRequire = createRequire(astroPackagePath);
          const sharpModule = astroRequire('sharp');
          const sharp = sharpModule.default ?? sharpModule;

          const boxWidth = 179;
          const boxHeight = 271;
          const padding = Math.max(3, Math.round(Math.min(boxWidth, boxHeight) * 0.055));
          const availableWidth = boxWidth - padding * 2;
          const availableHeight = boxHeight - padding * 2;
          const verticalOffset = Math.round(boxHeight * 0.04);
          const legacyTopOffset = 23;

          const citiesRoot = path.join(process.cwd(), 'public', 'assets', 'cities');
          const entries = await fs.readdir(citiesRoot, { withFileTypes: true });

          for (const entry of entries) {
            if (!entry.isDirectory()) continue;
            const file = path.join(citiesRoot, entry.name, 'hero', 'stamps', `${entry.name}-hero-stamp.webp`);
            try {
              const source = await sharp(file)
                .ensureAlpha()
                .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 8 })
                .toBuffer({ resolveWithObject: true });

              const { width, height } = source.info;
              const fittedScale = Math.min(availableWidth / width, availableHeight / height);
              const maximumScale = Math.min(boxWidth / width, boxHeight / height);
              const baseScale = Math.min(fittedScale * 1.11, maximumScale);
              const scale = baseScale * 1.015;
              const renderedWidth = Math.max(1, Math.round(width * scale));
              const renderedHeight = Math.max(1, Math.round(height * scale));

              const rendered = await sharp(source.data)
                .resize(renderedWidth, renderedHeight, { fit: 'fill' })
                .webp({ lossless: true, alphaQuality: 100 })
                .toBuffer();

              const left = Math.round((boxWidth - renderedWidth) / 2);
              const centeredTop = Math.round((boxHeight - renderedHeight) / 2);
              const fittedTop = Math.min(centeredTop + verticalOffset, boxHeight - renderedHeight);
              const top = fittedTop + legacyTopOffset;

              const temp = `${file}.tmp.webp`;
              await sharp({
                create: {
                  width: boxWidth,
                  height: boxHeight,
                  channels: 4,
                  background: { r: 0, g: 0, b: 0, alpha: 0 },
                },
              })
                .composite([{ input: rendered, left, top }])
                .webp({ lossless: true, alphaQuality: 100 })
                .toFile(temp);

              await fs.rename(temp, file);
              console.log(`${entry.name}: artwork ${width}x${height} -> ${renderedWidth}x${renderedHeight} in 179x271 at ${left},${top}`);
            } catch (error) {
              if (error?.code === 'ENOENT') continue;
              throw error;
            }
          }
          NODE
      - name: Commit normalized stamp assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/cities/*/hero/stamps/*.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize city Hero stamps to original V1 slot'
          git push origin HEAD:master
