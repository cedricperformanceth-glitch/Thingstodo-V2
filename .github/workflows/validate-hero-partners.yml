name: Validate Hero partners

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-hero-partners.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate project
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:city-media
          git diff --check
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/validate-hero-partners.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove temporary Hero partner validation workflow'
          git push origin HEAD:master
