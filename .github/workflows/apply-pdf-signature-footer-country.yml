name: Apply PDF signature and country footer color

on:
  push:
    branches:
      - fix/pdf-signature-footer-country-color

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-signature-footer-country-color
          fetch-depth: 0

      - name: Apply targeted PDF changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/summary/atlas-export-pdf.ts')
          text = path.read_text()

          old = "const paletteForCountry = (country = '') => COUNTRY_PALETTES[country.trim().toLowerCase()] ?? DEFAULT_PALETTE;\n"
          new = """const paletteForCountry = (country = '') => COUNTRY_PALETTES[country.trim().toLowerCase()] ?? DEFAULT_PALETTE;\n\nconst footerDividerColorForCountry = (country = ''): [number, number, number] => {\n  const normalized = country.trim().toLowerCase();\n  if (normalized === 'laos') return FOUNTAIN_INK_BLUE;\n  return paletteForCountry(country).primary;\n};\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  let page!: PdfPage;\n  let y = PAGE_H - 112;\n  let currentPalette = DEFAULT_PALETTE;\n"""
          new = """  let page!: PdfPage;\n  let y = PAGE_H - 112;\n  let currentPalette = DEFAULT_PALETTE;\n  let currentCountry = uniqueCountries.length === 1 ? uniqueCountries[0] : '';\n  let renderedCountries = 0;\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  const addFooter = (\n    target: PdfPage,\n    pageNumber: number,\n    dividerColor: [number, number, number] = [0.78, 0.75, 0.69],\n  ) => {\n    pdfLine(target, LEFT, 49, RIGHT, 49, dividerColor, 0.55);\n"""
          new = """  const addFooter = (target: PdfPage, pageNumber: number) => {\n    pdfLine(target, LEFT, 49, RIGHT, 49, footerDividerColorForCountry(currentCountry), 0.55);\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  countries.forEach((cities, country) => {\n    currentPalette = paletteForCountry(country);\n\n    // If the final country contains only the final city, break before the country heading\n"""
          new = """  countries.forEach((cities, country) => {\n    const countryPalette = paletteForCountry(country);\n    const freshPageY = PAGE_H - 88;\n\n    // Every additional country begins on a fresh content page so its footer color\n    // always belongs unambiguously to that country. The cover never receives a footer.\n    if (multiCountry && renderedCountries > 0 && y < freshPageY) {\n      addFooter(page, pages.length);\n      addPage();\n    }\n\n    // If the final country contains only the final city, break before the country heading\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    if (multiCountry) {\n      ensure(49);\n"""
          new = """    currentPalette = countryPalette;\n    currentCountry = country;\n\n    if (multiCountry) {\n      ensure(49);\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """      renderedCities += 1;\n    });\n  });\n\n  ensure(CLOSING_BLOCK_HEIGHT);\n"""
          new = """      renderedCities += 1;\n    });\n    renderedCountries += 1;\n  });\n\n  ensure(CLOSING_BLOCK_HEIGHT);\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = "pdfLine(page, LEFT, y - 7, LEFT + 82, y - 7, FOUNTAIN_INK_BLUE, 0.42);"
          new = "pdfLine(page, LEFT, y - 7, LEFT + 82, y - 7, footerDividerColorForCountry(currentCountry), 0.42);"
          assert old in text
          text = text.replace(old, new, 1)

          old = "page.commands.push(`q 150 0 0 54 ${(LEFT + 43).toFixed(2)} ${(y - 71).toFixed(2)} cm /ImSignature Do Q`);"
          new = "page.commands.push(`q 150 0 0 54 ${(LEFT + 58).toFixed(2)} ${(y - 71).toFixed(2)} cm /ImSignature Do Q`);"
          assert old in text
          text = text.replace(old, new, 1)

          old = "addFooter(page, pages.length, FOUNTAIN_INK_BLUE);"
          new = "addFooter(page, pages.length);"
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Validate diff
        run: git diff --check

      - name: Remove one-off workflow and commit result
        run: |
          rm .github/workflows/apply-pdf-signature-footer-country.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/summary/atlas-export-pdf.ts .github/workflows/apply-pdf-signature-footer-country.yml
          git commit -m "Refine PDF signature and country footer colors"
          git push origin HEAD:fix/pdf-signature-footer-country-color
