name: Definitive Thakhek dead-content cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: cleanup-thakhek-dead-content-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Remove retired activity and dead short-card content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const removedId = 'thing-tham-nang-aen-cave';
          const shortIds = new Set([
            'thing-tham-chang-elephant-cave',
            'thing-tha-falang',
            'thing-pha-inh-cave',
            'thing-cool-springs-loop',
            'thing-sandstone-buddhas',
          ]);
          const activeExploreBoardIds = [
            'thing-kong-lor-cave',
            'thing-xe-bang-fai-cave',
            'thing-hin-nam-no-national-park',
          ];

          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const writeJson = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);

          const sourceFile = 'pipeline/sources/laos/thakhek.json';
          const source = readJson(sourceFile);
          source.things = (source.things ?? []).filter((thing) => thing.id !== removedId);
          source.city ??= {};
          source.city.exploreBoard ??= {};
          source.city.exploreBoard.featuredThingIds = activeExploreBoardIds;
          writeJson(sourceFile, source);

          const contentDir = 'src/content';
          const compactFiles = new Set([
            'field-card-compact-copy.json',
            'field-card-compact-additions.json',
            'field-card-editorial-overrides.json',
            'field-card-editorial-thakhek.json',
            'field-card-editorial-thakhek-additions.json',
            'field-card-editorial-hin-nam-no.json',
          ]);
          const mediaFiles = new Set([
            'field-card-media-copy.json',
            'field-card-media-additions.json',
          ]);

          for (const name of fs.readdirSync(contentDir)) {
            if (!name.endsWith('.json') || name === 'thing-status-overrides.json') continue;
            const file = path.join(contentDir, name);
            const value = readJson(file);
            if (!value || Array.isArray(value) || typeof value !== 'object') continue;
            let changed = false;

            if (Object.prototype.hasOwnProperty.call(value, removedId)) {
              delete value[removedId];
              changed = true;
            }

            if (name === 'field-card-secondary-story-copy.json') {
              for (const id of shortIds) {
                if (Object.prototype.hasOwnProperty.call(value, id)) {
                  delete value[id];
                  changed = true;
                }
              }
            }

            if (compactFiles.has(name)) {
              for (const id of shortIds) {
                const entry = value[id];
                if (entry && typeof entry === 'object' && Object.prototype.hasOwnProperty.call(entry, 'secondaryStory')) {
                  delete entry.secondaryStory;
                  changed = true;
                }
                if (entry && Array.isArray(entry.media) && entry.media.length > 2) {
                  entry.media = entry.media.slice(0, 2);
                  changed = true;
                }
              }
            }

            if (mediaFiles.has(name)) {
              for (const id of shortIds) {
                const items = value[id];
                if (!Array.isArray(items) || items.length <= 2) continue;
                if (name === 'field-card-media-additions.json' && id === 'thing-cool-springs-loop') {
                  const drawing = items.find((item) => item?.id === 'cool-springs-loop-photo-3');
                  const firstPhoto = items.find((item) => item?.id !== 'cool-springs-loop-photo-3');
                  value[id] = [firstPhoto, drawing].filter(Boolean);
                } else {
                  value[id] = items.slice(0, 2);
                }
                changed = true;
              }
            }

            if (changed) writeJson(file, value);
          }

          const statusFile = path.join(contentDir, 'thing-status-overrides.json');
          if (fs.existsSync(statusFile)) fs.rmSync(statusFile);
          NODE

      - name: Regenerate Thakhek from canonical source
        run: npm run generate-city -- laos thakhek --skip-photo-discovery

      - name: Verify definitive cleanup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const removedId = 'thing-tham-nang-aen-cave';
          const shortIds = [
            'thing-tham-chang-elephant-cave',
            'thing-tha-falang',
            'thing-pha-inh-cave',
            'thing-cool-springs-loop',
            'thing-sandstone-buddhas',
          ];
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));

          for (const file of ['pipeline/sources/laos/thakhek.json', 'pipeline/cities/laos/thakhek.json']) {
            const data = read(file);
            if ((data.things ?? []).some((thing) => thing.id === removedId)) throw new Error(`${file}: retired Nang Aen still exists`);
          }

          const source = read('pipeline/sources/laos/thakhek.json');
          const expectedBoard = ['thing-kong-lor-cave', 'thing-xe-bang-fai-cave', 'thing-hin-nam-no-national-park'];
          if (JSON.stringify(source.city?.exploreBoard?.featuredThingIds) !== JSON.stringify(expectedBoard)) {
            throw new Error('Canonical Thakhek Explore Board still carries stale retired activity data');
          }

          const secondary = read('src/content/field-card-secondary-story-copy.json');
          for (const id of shortIds) {
            if (Object.prototype.hasOwnProperty.call(secondary, id)) throw new Error(`${id}: dead secondary story remains in legacy copy`);
          }

          const compactFiles = [
            'src/content/field-card-compact-copy.json',
            'src/content/field-card-compact-additions.json',
            'src/content/field-card-editorial-overrides.json',
            'src/content/field-card-editorial-thakhek.json',
            'src/content/field-card-editorial-thakhek-additions.json',
            'src/content/field-card-editorial-hin-nam-no.json',
          ];
          for (const file of compactFiles) {
            const data = read(file);
            for (const id of shortIds) {
              if (data[id] && Object.prototype.hasOwnProperty.call(data[id], 'secondaryStory')) {
                throw new Error(`${file}/${id}: dead secondaryStory remains`);
              }
              if (Array.isArray(data[id]?.media) && data[id].media.length > 2) {
                throw new Error(`${file}/${id}: short card still stores more than 2 media`);
              }
            }
          }

          for (const file of ['src/content/field-card-media-copy.json', 'src/content/field-card-media-additions.json']) {
            const data = read(file);
            for (const id of shortIds) {
              if (Array.isArray(data[id]) && data[id].length > 2) throw new Error(`${file}/${id}: short card still stores more than 2 media`);
            }
          }

          if (fs.existsSync('src/content/thing-status-overrides.json')) throw new Error('Retired status override file still exists');

          const targets = [
            'pipeline/sources/laos/thakhek.json',
            'pipeline/cities/laos/thakhek.json',
            'src/content/generated/laos/thakhek.ts',
          ];
          for (const file of targets) {
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes(removedId) || /Nang Aen/i.test(text)) throw new Error(`${file}: retired Nang Aen text remains`);
          }
          console.log('Definitive Thakhek cleanup verified.');
          NODE

      - name: Validate generator and build
        run: |
          npm run test:generation-integration
          npm run build

      - name: Commit cleanup and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-thakhek-dead-content-once.yml
          git add -A
          git commit -m "refactor: remove retired Thakhek content and short-card dead data"
          git push origin HEAD:master
