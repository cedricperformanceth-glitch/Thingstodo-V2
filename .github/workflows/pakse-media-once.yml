name: Complete Pakse activity media once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pakse-media-once.yml'

permissions:
  contents: write

jobs:
  complete-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add reviewed Commons media to Pakse activities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { tsModule } from './scripts/lib/city-pipeline.mjs';

          const sourceFile = 'pipeline/cities/laos/pakse.json';
          const generatedFile = 'src/content/generated/laos/pakse.ts';
          const draft = JSON.parse(fs.readFileSync(sourceFile, 'utf8'));

          const selections = {
            'thing-tad-fane': {
              titles: ['File:Tad Fane 2.jpg', 'File:Tad Fane.jpg', 'File:Tad Fane, Laos.jpg'],
              alts: [
                'Tad Fane twin waterfalls and rainforest gorge on the Bolaven Plateau',
                'Tad Fane waterfall dropping into the Bolaven Plateau gorge',
                'Tad Fane waterfall surrounded by forest on the Bolaven Plateau',
              ],
            },
            'thing-tad-yuang': {
              titles: ['File:Tad Yuang 01.jpg', 'File:Tad Yuang 02.jpg', 'File:Tad Yuang 03.jpg'],
              alts: [
                'Tad Yuang waterfall on the Bolaven Plateau',
                'View of Tad Yuang waterfall and its forested setting',
                'Tad Yuang waterfall seen from the Bolaven Plateau trail area',
              ],
            },
            'thing-bolaven-coffee-route': {
              titles: [
                'File:Coffee plantations Bolaven Plateau 01.jpg',
                'File:Coffee plantations Bolaven Plateau 02.jpg',
                'File:Coffee plantations Bolaven Plateau 03.jpg',
              ],
              alts: [
                'Coffee plantation on the Bolaven Plateau in southern Laos',
                'Coffee plants growing on the Bolaven Plateau',
                'Bolaven Plateau coffee plantation landscape',
              ],
            },
            'thing-wat-phou-salao': {
              titles: [
                'File:Golden Buddha of Wat Phou Salao, Pakse 20251228 (II).jpg',
                'File:Golden Buddha seen from behind at sunset at Wat Phou Salao temple in Pakse Laos.jpg',
                'File:Multiple rows of golden statues of the Buddha seated with flowers, at Wat Phou Salao, Pakse, Laos.jpg',
              ],
              alts: [
                'Golden Buddha at Wat Phou Salao in Pakse',
                'Golden Buddha overlooking the Mekong at sunset from Wat Phou Salao',
                'Rows of golden Buddha statues at Wat Phou Salao in Pakse',
              ],
            },
            'thing-wat-luang': {
              titles: ['File:Wat Luang 20251229.jpg', 'File:Wat Luang 20251229 (II).jpg', 'File:Wat Luang chedi and nagi in Pakse.jpg'],
              alts: [
                'Wat Luang Buddhist temple in Pakse',
                'Architectural view of Wat Luang in Pakse',
                'Chedi and naga details at Wat Luang in Pakse',
              ],
            },
            'thing-tad-champee': {
              titles: ['File:Tad Champi 01.jpg', 'File:Tad Champi 02.jpg', 'File:Tad Champi 03.jpg'],
              alts: [
                'Tad Champee waterfall on the Bolaven Plateau',
                'Forest and pool at Tad Champee waterfall',
                'Tad Champee waterfall in the Bolaven Plateau forest',
              ],
            },
            'thing-champasak-riverside': {
              titles: [
                'File:Mekong Champasak.jpg',
                'File:Champasak main street.jpg',
                'File:Exterior facade of Residence Bassac at blue hour, town of Champasak, Laos.jpg',
              ],
              alts: [
                'Mekong riverside at Champasak in southern Laos',
                'Main street through the riverside town of Champasak',
                'Historic riverside-town architecture in Champasak at blue hour',
              ],
            },
          };

          const allTitles = [...new Set(Object.values(selections).flatMap((selection) => selection.titles))];
          const params = new URLSearchParams({
            action: 'query',
            format: 'json',
            formatversion: '2',
            prop: 'info|imageinfo',
            inprop: 'url',
            iiprop: 'url|size|extmetadata',
            iiurlwidth: '1920',
            titles: allTitles.join('|'),
          });
          const response = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`, {
            headers: { 'User-Agent': 'ThingsToDoAtlas/2.0 Pakse media research' },
          });
          if (!response.ok) throw new Error(`Wikimedia Commons API returned HTTP ${response.status}`);
          const payload = await response.json();
          const pages = new Map((payload.query?.pages ?? []).map((page) => [page.title, page]));

          const stripHtml = (value = '') => String(value)
            .replace(/<[^>]*>/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#0?39;/g, "'")
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const normalizeLicense = (value = '') => {
            const license = stripHtml(value).toLowerCase();
            if (license.includes('cc by-sa') || license.includes('cc-by-sa')) return 'cc-by-sa';
            if (license.includes('cc by') || license.includes('cc-by')) return 'cc-by';
            if (license.includes('cc0')) return 'cc0';
            if (license.includes('public domain') || license === 'pd') return 'public-domain';
            return null;
          };

          const makeAsset = (title, alt) => {
            const page = pages.get(title);
            if (!page || page.missing) throw new Error(`Commons file not found: ${title}`);
            const info = page.imageinfo?.[0];
            if (!info) throw new Error(`Commons image metadata missing: ${title}`);
            const license = normalizeLicense(info.extmetadata?.LicenseShortName?.value);
            if (!license) throw new Error(`Commons license is not reusable for Atlas: ${title} (${info.extmetadata?.LicenseShortName?.value ?? 'unknown'})`);
            const width = Number(info.width ?? info.thumbwidth ?? 0);
            const height = Number(info.height ?? info.thumbheight ?? 0);
            if (Math.max(width, height) < 640 || Math.min(width, height) < 400) {
              throw new Error(`Commons image below Atlas minimum size: ${title} (${width}x${height})`);
            }
            const author = stripHtml(info.extmetadata?.Artist?.value);
            if (!author) throw new Error(`Commons author metadata missing: ${title}`);
            return {
              id: `commons-${page.pageid}`,
              src: info.thumburl ?? info.url,
              alt,
              sourceType: 'wikimedia',
              sourceUrl: page.canonicalurl,
              sourceName: 'Wikimedia Commons',
              author,
              license,
              manual: false,
              locked: false,
            };
          };

          for (const [thingId, selection] of Object.entries(selections)) {
            const thing = draft.things.find((entry) => entry.id === thingId);
            if (!thing) throw new Error(`Pakse activity not found: ${thingId}`);
            if (thing.media?.card?.image?.locked) throw new Error(`Refusing to overwrite locked media: ${thingId}`);
            const assets = selection.titles.map((title, index) => makeAsset(title, selection.alts[index]));
            if (assets.length !== 3) throw new Error(`${thingId}: expected exactly 3 reviewed media assets`);
            thing.media ??= {};
            thing.media.card = { ...(thing.media.card ?? {}), image: assets[0] };
            thing.media.fieldCard = { ...(thing.media.fieldCard ?? {}), gallery: assets };
            thing.spaCard ??= {};
            thing.spaCard.photoStatus = 'verified';
            thing.spaCard.photoRequiresManualFill = false;
          }

          // Dao Heuang Market intentionally remains missing: exact photos found during review were not reusable,
          // while Commons 'Pakse market' photos could not be confirmed as this specific market.
          const daoHeuang = draft.things.find((entry) => entry.id === 'thing-dao-heuang-market');
          if (!daoHeuang) throw new Error('Dao Heuang Market activity not found');
          if (!daoHeuang.media?.card?.image) {
            daoHeuang.spaCard.photoStatus = 'missing';
            daoHeuang.spaCard.photoRequiresManualFill = true;
          }

          fs.writeFileSync(sourceFile, `${JSON.stringify(draft, null, 2)}\n`);
          fs.writeFileSync(generatedFile, tsModule(draft));
          NODE

      - name: Verify Pakse media changes
        run: |
          npm run validate-content
          npm run test:spa-card-media
          npm run test:photo-discovery
          npm run check

      - name: Commit verified Pakse media and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/pakse-media-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cities/laos/pakse.json src/content/generated/laos/pakse.ts .github/workflows/pakse-media-once.yml
          git commit -m "Complete Pakse activity Commons media"
          git push origin HEAD:master
