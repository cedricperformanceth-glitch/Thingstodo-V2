name: Curate Don Det Explore Board

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/curate-don-det-explore-board.yml'

permissions:
  contents: write

jobs:
  curate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Curate canonical Don Det landmarks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('pipeline/cities/laos/don-det.json')
          draft = json.loads(path.read_text())
          draft['cityData']['exploreBoard'] = {
              'featuredThingIds': [
                  'thing-old-french-railway-bridge',
                  'thing-khone-phapheng-falls',
                  'thing-khone-pa-soi-waterfall',
              ]
          }

          def media(id_, src, alt, source_url, author=None, license_=None):
              item = {
                  'id': id_,
                  'src': src,
                  'alt': alt,
                  'sourceType': 'wikimedia',
                  'sourceUrl': source_url,
                  'sourceName': 'Wikimedia Commons',
                  'manual': True,
                  'locked': True,
              }
              if author: item['author'] = author
              if license_: item['license'] = license_
              return item

          bridge_image = media(
              'don-det-old-railway-bridge-card',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Si%20Phan%20Don%20-%20bridge%20from%20Don%20Det%20to%20Don%20Khone%20-%20Aug%202024.jpg?width=1600',
              'The historic bridge connecting Don Det and Don Khon in Si Phan Don',
              'https://commons.wikimedia.org/wiki/File:Si_Phan_Don_-_bridge_from_Don_Det_to_Don_Khone_-_Aug_2024.jpg',
              'Dominic Nelson',
              'CC BY-SA 4.0',
          )
          phapheng_image = media(
              'don-det-khone-phapheng-card',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Khone_Phapheng_Falls%2C_Si_Phan_Don%2C_Laos%2C_widest_waterfall_in_the_world.jpg?width=1600',
              'Wide view of Khone Phapheng Falls on the Mekong in southern Laos',
              'https://commons.wikimedia.org/wiki/File:Khone_Phapheng_Falls,_Si_Phan_Don,_Laos,_widest_waterfall_in_the_world.jpg',
          )
          pa_soi_image = media(
              'don-det-khone-pa-soi-card',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Main%20beach%20of%20Don%20Khon%20in%20Laos.jpg?width=1800',
              'Mekong landscape on Don Khon used as context for the Khone Pa Soi route',
              'https://commons.wikimedia.org/wiki/File:Main_beach_of_Don_Khon_in_Laos.jpg',
              'Basile Morin',
              'CC BY-SA 4.0',
          )

          things = draft['things']
          by_id = {thing['id']: thing for thing in things}

          bridge = by_id['thing-old-french-railway-bridge']
          bridge.update({
              'name': 'Don Khon & Old Railway Bridge',
              'slug': 'old-french-railway-bridge',
              'shortDescription': 'Cross the old railway bridge into Don Khon and follow the island paths beyond the busier edge of Don Det.',
              'longDescription': 'The old railway bridge links Don Det with Don Khon and opens a slower island route of bicycles, village paths and traces of the former portage railway built to bypass the Mekong rapids.',
              'googleMapsUrl': 'https://www.google.com/maps/search/?api=1&query=Old%20French%20Railway%20Bridge%20Don%20Det%20Don%20Khon%20Laos',
              'media': {'card': {'image': bridge_image}, 'fieldCard': {'gallery': [bridge_image]}},
              'exploreBoard': {
                  'kicker': 'BICYCLE · BRIDGE · ISLAND ROAD',
                  'duration': 'Half day',
                  'route': 'Cycle or walk from Don Det',
              },
          })

          def ensure_thing(thing):
              existing = by_id.get(thing['id'])
              if existing:
                  existing.update(thing)
              else:
                  things.append(thing)
                  by_id[thing['id']] = thing

          ensure_thing({
              'id': 'thing-khone-phapheng-falls',
              'slug': 'khone-phapheng-falls',
              'name': 'Khone Phapheng Falls',
              'country': 'laos',
              'city': 'don-det',
              'category': 'things-to-do',
              'coordinates': {'latitude': 13.95977, 'longitude': 105.98653},
              'googleMapsUrl': 'https://www.google.com/maps/search/?api=1&query=Khone%20Phapheng%20Falls%2C%20Laos',
              'shortDescription': 'Leave the island for the immense Khone Phapheng cataracts, where the Mekong breaks apart close to the Cambodian border.',
              'longDescription': 'A vast, powerful section of the Mekong where the river breaks across rocks and channels near the Cambodian border. This is a place for scale, sound and viewpoints.',
              'isLandmark': True,
              'media': {'card': {'image': phapheng_image}, 'fieldCard': {'gallery': [phapheng_image]}},
              'isMySelection': False,
              'sourceMetadata': {'sourceName': 'Atlas V1 curated landmark import', 'reviewedAt': '2026-08-11'},
              'manualLocks': {},
              'breadcrumbs': ['laos', 'don-det', 'things-to-do'],
              'fieldCard': {'template': 'compact', 'whyGo': '', 'practical': '', 'access': '', 'faq': [], 'sections': []},
              'exploreBoard': {
                  'kicker': 'WATERFALL · SCALE · SOUTH',
                  'duration': 'Half day',
                  'route': 'Boat to Nakasang, then road transfer',
              },
              'researchSources': [
                  {'sourceName': 'Wikimedia Commons', 'sourceUrl': phapheng_image['sourceUrl'], 'purpose': 'media', 'sourceType': 'wikimedia'},
                  {'sourceName': 'Google Maps', 'sourceUrl': 'https://www.google.com/maps', 'purpose': 'location'},
              ],
          })

          ensure_thing({
              'id': 'thing-khone-pa-soi-waterfall',
              'slug': 'khone-pa-soi-waterfall',
              'name': 'Khone Pa Soi Waterfall',
              'country': 'laos',
              'city': 'don-det',
              'category': 'things-to-do',
              'coordinates': {'latitude': 13.95492, 'longitude': 105.93754},
              'googleMapsUrl': 'https://www.google.com/maps/search/?api=1&query=Khone%20Pa%20Soi%20Waterfall%20Don%20Khon%20Laos',
              'shortDescription': 'Take the rougher eastern Don Khon route to a smaller waterfall and suspension-bridge landscape away from the main park.',
              'longDescription': 'A smaller, quieter waterfall route on the eastern side of Don Khon, associated with rough island tracks, a wooden suspension bridge and traces of the old river channel known as the Teak Way.',
              'isLandmark': True,
              'media': {'card': {'image': pa_soi_image}, 'fieldCard': {'gallery': [pa_soi_image]}},
              'isMySelection': False,
              'sourceMetadata': {'sourceName': 'Atlas V1 curated landmark import', 'reviewedAt': '2026-08-11'},
              'manualLocks': {},
              'breadcrumbs': ['laos', 'don-det', 'things-to-do'],
              'fieldCard': {'template': 'compact', 'whyGo': '', 'practical': '', 'access': '', 'faq': [], 'sections': []},
              'exploreBoard': {
                  'kicker': 'WATERFALL · SUSPENSION BRIDGE · QUIET',
                  'duration': '1–2 hours',
                  'route': 'Cycle across Don Khon',
              },
              'researchSources': [
                  {'sourceName': 'Wikimedia Commons', 'sourceUrl': pa_soi_image['sourceUrl'], 'purpose': 'media', 'sourceType': 'wikimedia'},
                  {'sourceName': 'Google Maps', 'sourceUrl': 'https://www.google.com/maps', 'purpose': 'location'},
              ],
          })

          path.write_text(json.dumps(draft, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Regenerate static Don Det module without normalization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { tsModule } from './scripts/lib/city-pipeline.mjs';
          const draft = JSON.parse(fs.readFileSync('pipeline/cities/laos/don-det.json', 'utf8'));
          fs.writeFileSync('src/content/generated/laos/don-det.ts', tsModule(draft));
          await import('./scripts/regenerate-content-registry.mjs');
          NODE
      - name: Validate Explore Board architecture
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:city-media
          npm run test:manual-locks
          git diff --check
      - name: Commit curated board and remove workflow
        if: always()
        run: |
          rm -f .github/workflows/curate-don-det-explore-board.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build universal curated Explore Board'
          git push origin HEAD:master
