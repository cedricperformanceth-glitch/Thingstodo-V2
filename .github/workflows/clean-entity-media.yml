name: Clean entity media manifests

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/clean-entity-media.yml'

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove legacy entity Hero media
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { tsModule } from './scripts/lib/city-pipeline.mjs';

          const root = process.cwd();
          const cityRoot = path.join(root, 'pipeline', 'cities');
          const files = fs.readdirSync(cityRoot, { recursive: true })
            .map(String)
            .filter((file) => file.endsWith('.json'));

          for (const relative of files) {
            const draftFile = path.join(cityRoot, relative);
            const draft = JSON.parse(fs.readFileSync(draftFile, 'utf8'));
            for (const entity of [...(draft.places ?? []), ...(draft.things ?? [])]) {
              if (entity.media) delete entity.media.hero;
            }
            fs.writeFileSync(draftFile, `${JSON.stringify(draft, null, 2)}\n`);
            const country = draft.country;
            const city = draft.city;
            const moduleFile = path.join(root, 'src', 'content', 'generated', country, `${city}.ts`);
            fs.mkdirSync(path.dirname(moduleFile), { recursive: true });
            fs.writeFileSync(moduleFile, tsModule(draft));
          }
          NODE
          node scripts/regenerate-content-registry.mjs
      - name: Validate
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:city-media
      - name: Remove temporary workflow
        run: rm -f .github/workflows/clean-entity-media.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove legacy Hero media from entities'
          git push origin HEAD:master
