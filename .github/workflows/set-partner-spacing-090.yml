name: Set partner spacing 090

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/set-partner-spacing-090.yml'

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Set equal partner spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/hero/CityHeroEnvelope.astro')
          s = p.read_text()
          old_label = 'margin: 0 0 .45rem .04rem;'
          old_gap = 'gap: .45rem;\n    width: min(19rem, 100%);'
          assert old_label in s, 'Partner label spacing not found'
          assert old_gap in s, 'Partner links gap not found'
          s = s.replace(old_label, 'margin: 0 0 .90rem .04rem;', 1)
          s = s.replace(old_gap, 'gap: .90rem;\n    width: min(19rem, 100%);', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit change and remove workflow
        run: |
          rm -f .github/workflows/set-partner-spacing-090.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Set Hero partner spacing to 0.90rem'
          git push origin HEAD:master
