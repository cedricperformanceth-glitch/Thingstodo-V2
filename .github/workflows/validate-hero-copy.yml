name: Validate Hero copy integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-hero-copy.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
      - name: Remove temporary workflow
        run: rm -f .github/workflows/validate-hero-copy.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Hero copy validation workflow'
          git push origin HEAD:master
