name: Validate universal SPA

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/finalize-universal-spa.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix Astro tab aria type
        run: sed -i 's/aria-selected={String(selected)}/aria-selected={selected}/' src/components/spa/CitySpa.astro
      - name: Mark Don Det as village
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pipeline/cities/laos/don-det.json';
          const draft = JSON.parse(fs.readFileSync(file, 'utf8'));
          const categories = ['things-to-do', 'accommodation', 'restaurants', 'cafes', 'practical-services'];
          draft.cityData.settlementType = 'village';
          draft.cityData.categories = categories;
          draft.cityData.categoryTargets = Object.fromEntries(
            Object.entries(draft.cityData.categoryTargets || {}).filter(([category]) => categories.includes(category))
          );
          fs.writeFileSync(file, `${JSON.stringify(draft, null, 2)}\n`);
          NODE
          node scripts/generate-city.mjs laos don-det --from-city
      - run: npm ci
      - name: Validate SPA and project
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          npm run test:spa-contract
          npm run test:favorites-scalability
          npm run test:city-media
          npm run test:manual-locks
          git diff --check
      - name: Commit generated contract and remove workflow
        run: |
          rm .github/workflows/finalize-universal-spa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize universal village SPA contract'
          git push origin master
