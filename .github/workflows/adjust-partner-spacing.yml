name: Adjust partner spacing

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/adjust-partner-spacing.yml'

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Adjust spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/hero/CityHeroEnvelope.astro')
          s = p.read_text()
          s = s.replace('margin: 0 0 .32rem .04rem;', 'margin: 0 0 .45rem .04rem;')
          s = s.replace('gap: .3rem;\n    width: min(19rem, 100%);', 'gap: .45rem;\n    width: min(19rem, 100%);')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit change and remove workflow
        run: |
          rm -f .github/workflows/adjust-partner-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Adjust Hero partner spacing'
          git push origin HEAD:master
