name: Validate shared card actions

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-card-actions.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate shared actions
        run: |
          npm run check
          npm run build
          npm run architecture-check
          npm run validate-content
          git diff --check
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/validate-card-actions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary card action validation workflow'
          git push origin master
