name: Trace compass reference once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/trace-compass-once.yml'
      - 'public/assets/PDF/compass.webp'

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tracing dependencies
        run: python -m pip install --quiet pillow opencv-python-headless numpy

      - name: Trace compass.webp to real vector SVG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np

          source = Path('public/assets/PDF/compass.webp')
          output = Path('public/assets/admin/svg-workbench/current/compass-pdf-reference-v1.svg')
          output.parent.mkdir(parents=True, exist_ok=True)

          bgr = cv2.imread(str(source), cv2.IMREAD_COLOR)
          if bgr is None:
              raise SystemExit(f'Could not read {source}')
          rgb = cv2.cvtColor(bgr, cv2.COLOR_BGR2RGB)
          h, w = rgb.shape[:2]

          # Estimate the white-page colour from all four corners, then remove only
          # pixels close to that paper colour so the compass itself is retained.
          corner = max(8, min(w, h) // 40)
          samples = np.concatenate([
              rgb[:corner, :corner].reshape(-1, 3),
              rgb[:corner, -corner:].reshape(-1, 3),
              rgb[-corner:, :corner].reshape(-1, 3),
              rgb[-corner:, -corner:].reshape(-1, 3),
          ], axis=0)
          paper = np.median(samples, axis=0).astype(np.float32)
          dist = np.linalg.norm(rgb.astype(np.float32) - paper[None, None, :], axis=2)
          brightness = rgb.mean(axis=2)
          foreground = (dist > 16.0) | (brightness < 238)

          # Remove isolated compression dust while keeping fine engraved lines.
          fg_u8 = (foreground.astype(np.uint8) * 255)
          fg_u8 = cv2.morphologyEx(fg_u8, cv2.MORPH_OPEN, np.ones((2, 2), np.uint8))
          foreground = fg_u8 > 0

          pixels = rgb[foreground]
          if len(pixels) < 100:
              raise SystemExit('Reference has too little foreground to trace.')

          # Quantise the actual compass colours, not the white page. A dozen
          # clusters keeps brass/wood/red/ink variations while avoiding raster noise.
          max_samples = 120000
          if len(pixels) > max_samples:
              step = max(1, len(pixels) // max_samples)
              train = pixels[::step][:max_samples]
          else:
              train = pixels
          train32 = np.float32(train.reshape(-1, 3))
          k = min(12, max(4, len(np.unique(train.reshape(-1, 3), axis=0)) // 32))
          criteria = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 45, 0.35)
          _, _, centers = cv2.kmeans(train32, k, None, criteria, 5, cv2.KMEANS_PP_CENTERS)
          centers = np.clip(np.rint(centers), 0, 255).astype(np.uint8)

          fg_coords = np.argwhere(foreground)
          fg_colors = rgb[foreground].astype(np.int16)
          center_i = centers.astype(np.int16)
          labels = np.empty(len(fg_colors), dtype=np.int16)
          chunk = 50000
          for start in range(0, len(fg_colors), chunk):
              part = fg_colors[start:start + chunk]
              d = ((part[:, None, :] - center_i[None, :, :]) ** 2).sum(axis=2)
              labels[start:start + len(part)] = np.argmin(d, axis=1)

          counts = np.bincount(labels, minlength=k)
          order = list(np.argsort(counts)[::-1])

          def esc(text):
              return text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w} {h}" role="img" aria-labelledby="title desc">',
              '<title id="title">Compass — traced PDF reference</title>',
              '<desc id="desc">Vector tracing of public/assets/PDF/compass.webp with the white page removed. Working SVG study for Atlas admin review.</desc>',
              '<g fill-rule="evenodd">',
          ]

          total_paths = 0
          for cluster in order:
              if counts[cluster] < 12:
                  continue
              mask = np.zeros((h, w), dtype=np.uint8)
              pts = fg_coords[labels == cluster]
              mask[pts[:, 0], pts[:, 1]] = 255

              # Close tiny WebP gaps, but do not blur the silhouette.
              mask = cv2.morphologyEx(mask, cv2.MORPH_CLOSE, np.ones((2, 2), np.uint8))
              contours, hierarchy = cv2.findContours(mask, cv2.RETR_CCOMP, cv2.CHAIN_APPROX_SIMPLE)
              if hierarchy is None:
                  continue
              hierarchy = hierarchy[0]
              colour = centers[cluster]
              hex_colour = '#%02x%02x%02x' % tuple(int(v) for v in colour)

              # Snap near-black to a stable ink colour and near-neutral pale facets
              # away from pure white so they remain visible on transparent output.
              if max(colour) < 55:
                  hex_colour = '#171717'
              elif (max(colour) - min(colour) < 10) and colour.mean() > 225:
                  hex_colour = '#eee8da'

              paths = []
              for i, contour in enumerate(contours):
                  if hierarchy[i][3] != -1:
                      continue
                  area = abs(cv2.contourArea(contour))
                  if area < 5:
                      continue
                  epsilon = max(0.55, 0.0015 * cv2.arcLength(contour, True))
                  approx = cv2.approxPolyDP(contour, epsilon, True).reshape(-1, 2)
                  if len(approx) < 3:
                      continue
                  pieces = ['M ' + ' L '.join(f'{int(x)} {int(y)}' for x, y in approx) + ' Z']
                  child = hierarchy[i][2]
                  while child != -1:
                      c = contours[child]
                      if abs(cv2.contourArea(c)) >= 4:
                          ep = max(0.55, 0.0015 * cv2.arcLength(c, True))
                          ap = cv2.approxPolyDP(c, ep, True).reshape(-1, 2)
                          if len(ap) >= 3:
                              pieces.append('M ' + ' L '.join(f'{int(x)} {int(y)}' for x, y in ap) + ' Z')
                      child = hierarchy[child][0]
                  paths.append(' '.join(pieces))

              if paths:
                  svg.append(f'<path fill="{hex_colour}" d="' + ' '.join(paths) + '"/>')
                  total_paths += 1

          svg += [
              '</g>',
              f'<!-- traced from {source}; source size {w}x{h}; {total_paths} colour layers; white paper intentionally transparent -->',
              '</svg>',
          ]
          output.write_text('\n'.join(svg), encoding='utf-8')
          print(f'TRACE_SOURCE={source}')
          print(f'TRACE_SIZE={w}x{h}')
          print(f'PAPER_RGB={tuple(int(v) for v in paper)}')
          print(f'FOREGROUND_PIXELS={int(foreground.sum())}')
          print(f'COLOUR_LAYERS={total_paths}')
          print(f'OUTPUT_BYTES={output.stat().st_size}')
          PY

      - name: Commit traced SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/admin/svg-workbench/current/compass-pdf-reference-v1.svg
          git commit -m 'Trace PDF compass reference into SVG workbench'
          git push
