<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Large Atlas clipboard frame</title>
  <desc id="desc">A large dark green travel clipboard holding a warm paper sheet, designed as the frame for the Trip Summary interface.</desc>
  <defs>
    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#16231d" flood-opacity=".22"/>
    </filter>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#16231d" flood-opacity=".12"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="22" y="28" width="1156" height="944" rx="48" fill="#2f4a3f" stroke="#20352c" stroke-width="6" filter="url(#boardShadow)"/>
    <rect x="40" y="46" width="1120" height="908" rx="38" stroke="#64796f" stroke-width="2" opacity=".62"/>
    <path d="M73 80C205 60 321 64 420 74" stroke="#7c9187" stroke-width="2" opacity=".32"/>
    <path d="M1127 914C1012 935 895 934 797 926" stroke="#172a22" stroke-width="2" opacity=".35"/>

    <rect x="72" y="72" width="1056" height="856" rx="27" fill="#f3ede0" stroke="#d1c6b4" stroke-width="3" filter="url(#paperShadow)"/>
    <rect x="88" y="88" width="1024" height="824" rx="20" stroke="#ded5c5" stroke-width="1.5" opacity=".72"/>

    <path d="M101 152C204 146 296 148 385 153" stroke="#315f83" stroke-width="3" opacity=".22"/>
    <path d="M818 867C886 855 954 858 1032 870" stroke="#9e5f53" stroke-width="3" opacity=".20"/>
    <path d="M1014 131C1036 119 1060 124 1071 141C1082 157 1070 175 1048 176C1028 177 1011 162 1016 147C1019 137 1030 132 1040 133" stroke="#315545" stroke-width="2.5" opacity=".20"/>
  </g>
</svg>
