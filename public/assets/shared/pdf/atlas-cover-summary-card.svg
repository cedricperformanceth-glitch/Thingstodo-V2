<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
  <title id="title">Atlas cover summary paper</title>
  <desc id="desc">A warm paper note with a strip of masking tape, soft shadow and subtle travel-notebook details.</desc>
  <defs>
    <filter id="paperShadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#22211d" flood-opacity="0.22"/>
    </filter>
    <filter id="tapeShadow" x="-15%" y="-30%" width="130%" height="165%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2d2a23" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="paperWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.58" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#f5ecda"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c79b" stop-opacity="0.80"/>
      <stop offset="0.48" stop-color="#ead9aa" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#d4bf8d" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" fill="#8f816a" opacity="0.08"/>
      <circle cx="9" cy="8" r="0.45" fill="#5d5548" opacity="0.06"/>
      <path d="M0 11h12" stroke="#887b65" stroke-width="0.35" opacity="0.035"/>
    </pattern>
  </defs>

  <g filter="url(#paperShadow)">
    <path d="M20 28 C132 20 470 21 597 31 L605 224 C481 235 137 236 16 225 Z" fill="url(#paperWash)" stroke="#c9bda8" stroke-width="1.5"/>
    <path d="M20 28 C132 20 470 21 597 31 L605 224 C481 235 137 236 16 225 Z" fill="url(#grain)"/>
    <path d="M43 83 C178 80 440 80 577 85" fill="none" stroke="#d9cfbd" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.85"/>
    <path d="M43 193 C179 196 438 196 577 191" fill="none" stroke="#e0d6c5" stroke-width="1" opacity="0.68"/>
    <path d="M35 46l12 4-9 9" fill="none" stroke="#b6a891" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="572" cy="205" r="8" fill="none" stroke="#9a8e79" stroke-width="1" opacity="0.30"/>
    <path d="M572 199v12M566 205h12" stroke="#9a8e79" stroke-width="0.9" opacity="0.26"/>
  </g>

  <g filter="url(#tapeShadow)" transform="rotate(-2 310 28)">
    <path d="M242 9 L379 13 L374 49 L236 45 Z" fill="url(#tape)"/>
    <path d="M244 13 L377 16" stroke="#fff7dc" stroke-width="1" opacity="0.48"/>
    <path d="M246 43 L372 46" stroke="#9c8a65" stroke-width="0.8" opacity="0.18"/>
  </g>
</svg>
