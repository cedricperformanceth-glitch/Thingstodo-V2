<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 760" role="img" aria-labelledby="title desc">
  <title id="title">Atlas binder edge</title>
  <desc id="desc">A subtle vertical row of punched paper holes and dark metal binder rings.</desc>
