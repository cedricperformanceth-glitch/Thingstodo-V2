<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 760" role="img" aria-labelledby="title desc">
  <title id="title">Atlas two-ring binder edge</title>
  <desc id="desc">Two large D-shaped metal binder rings attached to a narrow brushed metal spine.</desc>
  <defs>
    <filter id="shadow" x="-45%" y="-20%" width="190%" height="145%">
      <feDropShadow dx="1.4" dy="2.4" stdDeviation="2.2" flood-color="#111412" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#747771"/>
      <stop offset="0.26" stop-color="#dadbd6"/>
      <stop offset="0.54" stop-color="#8e918b"/>
      <stop offset="0.78" stop-color="#ecece8"/>
      <stop offset="1" stop-color="#676a65"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f1ed"/>
      <stop offset="0.26" stop-color="#747873"/>
      <stop offset="0.52" stop-color="#e7e8e4"/>
      <stop offset="0.78" stop-color="#555955"/>
      <stop offset="1" stop-color="#bfc1bc"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="150" width="13" height="460" rx="6.5" fill="url(#spine)" stroke="#555954" stroke-width="1"/>
    <path d="M12 179h5M12 581h5" stroke="#f4f4f0" stroke-width="1.3" opacity="0.72" stroke-linecap="round"/>
    <circle cx="14.5" cy="181" r="2.3" fill="#5f625e" stroke="#dedfda" stroke-width="0.8"/>
    <circle cx="14.5" cy="579" r="2.3" fill="#5f625e" stroke="#dedfda" stroke-width="0.8"/>

    <g fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 268 C35 246 62 248 70 268 C76 284 70 302 55 309 C43 315 33 308 28 298"/>
      <path d="M18 492 C35 470 62 472 70 492 C76 508 70 526 55 533 C43 539 33 532 28 522"/>
    </g>

    <g fill="#f7f1e5" stroke="#a59d8f" stroke-width="1.2">
      <path d="M25 290 C29 284 38 283 43 288 C47 292 47 300 42 304 C36 309 27 305 24 299 Z"/>
      <path d="M25 514 C29 508 38 507 43 512 C47 516 47 524 42 528 C36 533 27 529 24 523 Z"/>
    </g>

    <g fill="none" stroke="#ffffff" stroke-width="1.25" opacity="0.48" stroke-linecap="round">
      <path d="M23 267 C40 251 60 255 65 270"/>
      <path d="M23 491 C40 475 60 479 65 494"/>
    </g>
  </g>
</svg>
