      <ellipse cx="33" cy="232" rx="7.3" ry="6.1"/>
      <ellipse cx="33" cy="372" rx="7.3" ry="6.1"/>
      <ellipse cx="33" cy="512" rx="7.3" ry="6.1"/>
      <ellipse cx="33" cy="652" rx="7.3" ry="6.1"/>
    </g>
