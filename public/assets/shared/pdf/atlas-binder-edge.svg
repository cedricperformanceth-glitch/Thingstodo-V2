      <feDropShadow dx="0.7" dy="1.2" stdDeviation="1.1" flood-color="#1d1f1e" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="ringMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b4b48"/>
      <stop offset="0.45" stop-color="#1f211f"/>
      <stop offset="0.72" stop-color="#5a5a56"/>
      <stop offset="1" stop-color="#252725"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
