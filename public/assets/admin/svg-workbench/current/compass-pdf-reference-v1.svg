<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
<title id="title">Nautical compass — refined vector study</title>
<desc id="desc">Clean vector reconstruction inspired by public/assets/PDF/compass.webp. Transparent background, antique brass housing, cream dial, compass rose, cardinal marks and glass highlights.</desc>
<defs>
  <radialGradient id="brassFace" cx="38%" cy="28%" r="75%">
    <stop offset="0" stop-color="#f3dda0"/>
    <stop offset=".38" stop-color="#d5aa52"/>
    <stop offset=".72" stop-color="#a9782d"/>
    <stop offset="1" stop-color="#5f3b18"/>
  </radialGradient>
  <linearGradient id="brassEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5b3718"/>
    <stop offset=".16" stop-color="#c28e3c"/>
    <stop offset=".34" stop-color="#f1d584"/>
    <stop offset=".55" stop-color="#9b6928"/>
    <stop offset=".74" stop-color="#e1b95f"/>
    <stop offset="1" stop-color="#4c2e15"/>
  </linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#31302b"/>
    <stop offset=".5" stop-color="#161714"/>
    <stop offset="1" stop-color="#070806"/>
  </linearGradient>
  <radialGradient id="dialPaper" cx="42%" cy="35%" r="74%">
    <stop offset="0" stop-color="#fff8df"/>
    <stop offset=".56" stop-color="#f1e2b7"/>
    <stop offset=".88" stop-color="#d8c28f"/>
    <stop offset="1" stop-color="#b49a68"/>
  </radialGradient>
  <linearGradient id="redNeedle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9b2d24"/>
    <stop offset="1" stop-color="#58140f"/>
  </linearGradient>
  <linearGradient id="inkNeedle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#333b3c"/>
    <stop offset="1" stop-color="#101515"/>
  </linearGradient>
  <radialGradient id="hubMetal" cx="35%" cy="25%" r="75%">
    <stop offset="0" stop-color="#fff0b1"/>
    <stop offset=".42" stop-color="#c5953d"/>
    <stop offset="1" stop-color="#664019"/>
  </radialGradient>
  <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".47"/>
    <stop offset=".42" stop-color="#ffffff" stop-opacity=".11"/>
    <stop offset="1" stop-color="#d9f0ed" stop-opacity="0"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <line id="minorTick" x1="550" y1="190" x2="550" y2="216" stroke="#2b2923" stroke-width="5" stroke-linecap="round"/>
  <line id="majorTick" x1="550" y1="181" x2="550" y2="226" stroke="#181815" stroke-width="8" stroke-linecap="round"/>
</defs>

