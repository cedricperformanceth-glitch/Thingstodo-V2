  <use href="#secondary-needle" transform="rotate(337.5 500 500)"/>

  <use href="#fine-needle" transform="rotate(11.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(33.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(56.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(78.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(101.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(123.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(146.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(168.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(191.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(213.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(236.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(258.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(281.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(303.75 500 500)"/>
  <use href="#fine-needle" transform="rotate(326.25 500 500)"/>
  <use href="#fine-needle" transform="rotate(348.75 500 500)"/>
</g>

<!-- North accent from the reference -->
<polygon points="500,160 500,466 475,500" fill="#9e3d33" stroke="#171717" stroke-width="2"/>
<polygon points="500,58 486,84 500,76 514,84" fill="#9e3d33" stroke="#171717" stroke-width="3"/>

<g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#171717" text-anchor="middle">
  <text x="500" y="121" font-size="40" fill="#9e3d33">N</text>
  <text x="888" y="523" font-size="36">E</text>
  <text x="500" y="928" font-size="36">S</text>
  <text x="109" y="523" font-size="36">W</text>
  <text x="232" y="244" font-size="24">NW</text>
  <text x="768" y="244" font-size="24">NE</text>
  <text x="235" y="786" font-size="24">SW</text>
  <text x="765" y="786" font-size="24">SE</text>
</g>

<circle cx="500" cy="500" r="33" fill="#f4efe1" stroke="#171717" stroke-width="3"/>
<circle cx="500" cy="500" r="12" fill="#171717"/>
</svg>
